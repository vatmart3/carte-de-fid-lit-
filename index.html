  /* Le fichier choisi est redessiné dans un canevas puis réencodé en PNG.
     Deux raisons : la taille (un logo d'imprimeur pèse plusieurs mégaoctets,
     il doit tenir dans une fiche de base), et la sûreté — un SVG est du code,
     et celui-ci finit dans la page. Redessiné, il n'en reste qu'une image. */
  "pick-logo": function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    if (f.size > 6e6) { toast("Fichier trop lourd (6 Mo au maximum).", "bad"); return; }
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      // 384 px suffisent : le plus grand emploi est le filigrane de la carte,
      // 124 points d'écran, soit 372 pixels sur un téléphone très fin. Au-delà
      // on alourdirait chaque ouverture du site pour rien.
      var MAX = 384;
      var w = img.naturalWidth, h = img.naturalHeight;
      if (!w || !h) { toast("Image illisible.", "bad"); return; }
      // Un logo d'imprimeur arrive presque toujours seul au milieu d'une page
      // blanche. Réduire d'abord reviendrait à jeter la finesse du dessin pour
      // ne garder que du vide : on recadre donc sur l'encre à pleine
      // résolution, et on ne réduit qu'ensuite.
      var b = encadre(img, w, h);
      var cw = b.x1 - b.x0 + 1, ch = b.y1 - b.y0 + 1;
      var k = Math.min(1, MAX / Math.max(cw, ch));
      var cv = document.createElement("canvas");
      cv.width = Math.max(1, Math.round(cw * k));
      cv.height = Math.max(1, Math.round(ch * k));
      var cx = cv.getContext("2d");
      cx.imageSmoothingQuality = "high";
      cx.drawImage(img, b.x0, b.y0, cw, ch, 0, 0, cv.width, cv.height);
      var png;
      try { png = cv.toDataURL("image/png"); }
      catch (e) { toast("Image illisible.", "bad"); return; }
      if (png.length > 130000) {
        toast("Logo trop détaillé pour être enregistré. Réduisez-le avant de le reprendre.", "bad");
        return;
      }
      DB.shop.logo = png;
      // Un logo qui porte son propre fond n'a pas besoin de la plaque : on
      // l'arrondit et on le pose tel quel, c'est ainsi qu'il a été dessiné.
      DB.shop.logo_fond = !!b.fond;
      var nom = document.getElementById("logo-nom");
      if (nom) {
        nom.textContent = f.name + (b.rogne ? " · marge retirée" : "") +
          " · " + cv.width + "×" + cv.height;
      }
      var box = document.getElementById("logo-try");
      if (box) box.innerHTML = logoApercu();
      var glyphes = document.querySelectorAll(".topbar .mark-glyph");
      for (var i = 0; i < glyphes.length; i++) {
        glyphes[i].outerHTML = markGlyph();
      }
      toast("Logo chargé. Enregistrez pour le garder.", "ok");
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      toast("Ce fichier n\'est pas une image que le navigateur sait ouvrir.", "bad");
    };
    img.src = url;
  },
  "logo-clair": function (el) {
    DB.shop.logo_clair = !!el.checked;
    var box = document.getElementById("logo-try");
    if (box) box.innerHTML = logoApercu();
  },
  "logo-off": function () {
    DB.shop.logo = ""; DB.shop.logo_clair = false; DB.shop.logo_fond = false;

    r.onload = function () { var t = document.getElementById("r-txt"); if (t) t.value = r.result; };
    r.readAsText(f);
  }
};

    sh.name = f.name.value.trim() || sh.name;
    sh.city = f.city.value.trim(); sh.tagline = f.tagline.value.trim();
    sh.ppe = Math.max(0.1, Number(f.ppe.value) || 1);
    sh.welcome = Math.max(0, Math.round(Number(f.welcome.value) || 0));
    sh.birthday = Math.max(0, Math.round(Number(f.birthday.value) || 0));
    sh.godfather = Math.max(0, Math.round(Number(f.godfather.value) || 0));
    sh.godchild = Math.max(0, Math.round(Number(f.godchild.value) || 0));
    sh.lock_minutes = Math.max(0, Math.round(Number(f.lock_minutes.value)));
    sh.legal = sh.legal || {};
    sh.retention_years = sh.retention_years || 3;
    // le logo a été posé dans DB.shop au moment du choix du fichier
    sh.logo = DB.shop.logo || "";
    sh.logo_clair = !!DB.shop.logo_clair;
    sh.logo_fond = !!DB.shop.logo_fond;
    if (Store.mode === "supabase") return remote(saveShopRemote(sh), "Réglages enregistrés.");
    logIt("Réglages de la boutique modifiés");
    persist("Réglages enregistrés.");
  },
  "save-rewards": function (f) {
    var ps = f.querySelectorAll('input[name=p]'), ls = f.querySelectorAll('input[name=l]'), out = [];
    for (var i = 0; i < ps.length; i++) {
      var p = Math.round(Number(ps[i].value)), l = ls[i].value.trim();
      if (p > 0 && l) out.push({ p: p, label: l });
    }
    if (!out.length) return toast("Gardez au moins une récompense.", "bad");
    out.sort(function (a, b) { return a.p - b.p; });
    if (Store.mode === "supabase") {
      var sh2 = JSON.parse(JSON.stringify(DB.shop)); sh2.rewards = out;
      return remote(saveShopRemote(sh2), "Barème enregistré.");
    }
    DB.shop.rewards = out;
    logIt("Barème de récompenses modifié");
    persist("Barème enregistré.");
  },
  "save-pin": function (f) {
    var box = document.getElementById("pin-err");
    if (String(f.old.value) !== String(DB.admin.pin)) { box.innerHTML = '<p class="err">Code actuel incorrect.</p>'; return; }
    var n = String(f.neo.value).trim();
    if (n.length < 4) { box.innerHTML = '<p class="err">4 caractères minimum.</p>'; return; }
    DB.admin.pin = n; logIt("Code d'accès modifié");
    persist("Code d'accès changé.");
  },
  "do-restore": function (f) {
    var box = document.getElementById("r-err");
    try {
      var d = migrate(JSON.parse(f.json.value));
      if (!d || !d.clients) throw 0;
      if (Store.mode === "supabase")
        return remote(rpc("import_clients", { p_data: d }, true),
          "Import terminé : " + d.clients.length + " fiches.");
      DB = d; logIt("Sauvegarde restaurée");
      closeModal(); persist("Sauvegarde restaurée : " + d.clients.length + " fiches.");
    } catch (e) { box.innerHTML = '<p class="err">Fichier illisible. Collez le contenu complet du fichier JSON.</p>'; }
  }
};

/* ── écouteurs ── */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act;
  if (el.tagName === "FORM" || el.tagName === "INPUT" || el.tagName === "SELECT") return;
  if (el.tagName === "TEXTAREA") return;
  if (ACTS[a]) { ev.preventDefault(); S.scroll = window.scrollY; touchLock(); ACTS[a](el, ev); }
});
document.addEventListener("submit", function (ev) {
  var f = ev.target.closest("form[data-act]");
  if (!f) return;
  ev.preventDefault();
  var h = FORMS[f.dataset.act];
  if (h) { S.scroll = window.scrollY; touchLock(); h(f, f); }
});
document.addEventListener("change", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "sort") { S.scroll = window.scrollY; ACTS.sort(el); }
  if (el.dataset.act === "pick-file") ACTS["pick-file"](el);
  if (el.dataset.act === "pick-logo") ACTS["pick-logo"](el);
  if (el.dataset.act === "logo-clair") ACTS["logo-clair"](el);
  if (el.dataset.act === "scan-file" && el.files && el.files[0]) scanPhoto(el.files[0]);
  if (el.dataset.act === "toggle-pub") { S.scroll = window.scrollY; ACTS["toggle-pub"](el); }
});

/* Le message se tape dans une fenêtre que l'on redessine (nature, modèle,
   compte des destinataires) : le texte doit survivre à chaque redessin. */
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (!el || !el.dataset) return;
  if (el.dataset.act === "msg-sujet") { S.msgSujet = el.value; return; }
  if (el.dataset.act !== "msg-type") return;
  S.msgText = el.value;
  var hint = el.parentNode ? el.parentNode.querySelector(".hint .num") : null;
  if (hint) hint.textContent = String(el.value.length);
  var send = document.querySelectorAll('[data-act="msg-sms"], [data-act="msg-mail"], ' +
    '[data-act="brevo-mail"], [data-act="brevo-sms"]');
  for (var i = 0; i < send.length; i++) send[i].disabled = !el.value;
});
/* La caisse propose des noms au fur et à mesure. On ne redessine que la
   liste : un render() complet reprendrait le champ et le clavier se
   refermerait à chaque lettre tapée. */
var tt = null;
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (!el.dataset || el.dataset.act !== "till-live") return;
  S.tillQ = el.value;
  clearTimeout(tt);
  tt = setTimeout(function () {
    var box = document.getElementById("tsugg");
    if (box) box.innerHTML = suggHtml(S.tillQ, tillPar());
  }, 80);
});
document.addEventListener("keydown", function (ev) {
  var champ = ev.target.dataset && ev.target.dataset.act === "till-live";
  var prop = ev.target.classList && ev.target.classList.contains("sugg-i");
  if (!champ && !prop) return;
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  var box = document.getElementById("tsugg");
  if (!box) return;
  var l = [].slice.call(box.querySelectorAll(".sugg-i"));
  if (!l.length) return;
  ev.preventDefault();
  var i = l.indexOf(ev.target);
  if (ev.key === "ArrowDown") (l[i + 1] || l[0]).focus();
  else if (i <= 0) { var ch = document.getElementById("tq"); if (ch) ch.focus(); }
  else l[i - 1].focus();
});
var qt = null;
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (el.dataset && el.dataset.act === "search-live") {
    clearTimeout(qt);
    qt = setTimeout(function () { S.q = el.value; S.focusId = "cq"; S.scroll = window.scrollY; render(); }, 220);
  }
});
/* Au comptoir sur un ordinateur ou une tablette à clavier, on tape les chiffres
   directement : le pavé à l'écran et les touches doivent mener au même endroit. */
document.addEventListener("keydown", function (ev) {
  if (!S.admin || S.tab !== "till" || !(S.till && S.till.cid)) return;
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  var t = ev.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  var k = "";
  if (/^[0-9]$/.test(ev.key)) k = ev.key;
  else if (ev.key === "Backspace") k = "<";
  else if (ev.key === "Escape" && payCents()) k = "C";
  else return;
  ev.preventDefault();
  ACTS.pad({ dataset: { k: k } });
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter" && ev.target.tagName === "TR" && ev.target.dataset.act) {
    ACTS[ev.target.dataset.act](ev.target, ev);
  }
  if ((ev.key === " " || ev.key === "Enter") && ev.target.getAttribute &&
      ev.target.getAttribute("role") === "checkbox" && ev.target.dataset.act) {
    ev.preventDefault();
    ACTS[ev.target.dataset.act](ev.target, ev);
  }
});

/* ── démarrage ── */
function bootFail(e) {
  S.view = "error"; S.errMsg = errMsg(e); render();
}

/* Démarrage quand une base en ligne est configurée. */
function bootRemote() {
  var tok = urlToken();
  if (tok) {
    return rpc("get_card", { p_token: tok }).then(function (card) {
      if (!card) {
        S.view = "find";
        return sbShop().then(function () {
          render();
          toast("Ce lien de carte n'existe plus.", "bad");
        });
      }
      DB = { v: 1, shop: card.shop, admin: { pin: "" }, seq: 0,
             clients: [cardToClient(card, tok)], recent: [], log: [] };
      S.cid = card.id; S.view = "card"; S.admin = false;
      render();
    })["catch"](bootFail);
  }
  var till = urlTill();
  return sbShop().then(function () {
    return sbRestore();
  }).then(function (ok) {
    if (lockExpired()) { S.admin = false; S.lockEmail = SB.email; sbLogout(); ok = false; }
    if (!ok) { S.admin = false; if (till) applyTill(till); render(); return; }
    if (!S.admin) { if (till) applyTill(till); render(); return; }
    return sbLoadAll().then(function () { return verifStaff(); }).then(function () {
      S.tab = S.tab || "dash";
      if (till) applyTill(till);
      render();
    });
  })["catch"](bootFail);
}

function boot() {
  // C'est la page qui replace le lecteur où il était : le navigateur ne doit
  // pas s'en mêler après un rechargement, sinon la vue saute deux fois.
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  DB = migrate(embedded()) || { v: 1, shop: {}, admin: { pin: "4726" }, seq: 1000, clients: [], log: [] };
  S = loadSession();

  var cfg = sbConfig();
  if (cfg) {
    SB.url = cfg.url.replace(/\/+$/, ""); SB.key = cfg.key;
    Store.mode = "supabase";
    if (S.view === "card" && !urlToken()) S.view = "home";
    return bootRemote();
  }

  var api = window.claude && window.claude.use ? window.claude.use("artifact") : null;
  var done = function () {
    if (Store.mode !== "cloud") {
      var l = lsGet(LS_DB);
      if (l) { try { var d = migrate(JSON.parse(l)); if (d) DB = d; } catch (e) {} }
    }
    // L'année de naissance ne doit pas survivre à la mise à niveau : dès que la
    // base locale est reprise, on la réécrit sans elle.
    if (migrated && Store.mode === "local") { localSave(); migrated = false; }
    if (lockExpired()) { S.admin = false; S.lockAt = 0; }
    var till = urlTill();
    if (till) applyTill(till);
    if (!S.cid) { var me = lsGet(LS_ME); if (me && byId(me)) S.cid = me; }
    if (S.view === "card" && !byId(S.cid)) S.view = "home";
    render();
    if (S.flash) { toast(S.flash, "ok"); S.flash = ""; saveSession(); }
  };
  if (api && api.then) {
    api.then(function (a) { if (a) { Store.api = a; Store.mode = "cloud"; } done(); })["catch"](done);
  } else { done(); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
