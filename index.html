/* ══════════════════════════ 2. Utilitaires ══════════════════════════ */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function today() { return new Date().toISOString().slice(0, 10); }
/* Le français groupe les milliers par une espace fine insécable que toutes les
   polices ne dessinent pas : sans elle, « 2 058 » s'affiche « 2058 ». On la
   remplace par une insécable ordinaire, présente partout. */
function esp(t) { return String(t).replace(/\u202F/g, "\u00A0"); }
function eur(n) { return esp((Math.round(n * 100) / 100).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })) + " €"; }
function eur0(n) { return esp(Math.round(n).toLocaleString("fr-FR")) + " €"; }
function nb(n) { return esp(Number(n || 0).toLocaleString("fr-FR")); }
var MOIS = ["janv.", "févr.", "mars", "avril", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
var MOIS_L = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function dShort(iso) { if (!iso) return "—"; var p = iso.split("-"); return Number(p[2]) + " " + MOIS[Number(p[1]) - 1]; }
/* Accepte aussi bien « 2026-08-25 » qu'un horodatage complet : le jour tenait
   la fin de la chaîne et sortait en « NaN août ». */
function dFull(iso) {
  if (!iso) return "—";
  var p = d10(iso).split("-");
  if (p.length < 3) return "—";
  return Number(p[2]) + " " + MOIS_L[Number(p[1]) - 1] + " " + p[0];
}
function daysAgo(iso) { if (!iso) return 9999; return Math.round((new Date(today()) - new Date(iso)) / 864e5); }
function initials(n) { return n.trim().split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }
function normPhone(p) { return String(p || "").replace(/[^0-9+]/g, ""); }
function prettyPhone(p) { var s = normPhone(p); return s.length === 10 ? s.replace(/(\d{2})(?=\d)/g, "$1 ").trim() : s; }
function slug(n) { return n.normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase(); }

function tierOf(life) {
  var t = DB.shop.tiers, cur = t[0];
  for (var i = 0; i < t.length; i++) if (life >= t[i].min) cur = t[i];
  return cur.label;
}
function rewards() { return (DB.shop.rewards || []).slice().sort(function (a, b) { return a.p - b.p; }); }
function nextReward(pts) {
  var r = rewards();
  for (var i = 0; i < r.length; i++) if (r[i].p > pts) return r[i];
  return null;
}
function unlocked(pts) { return rewards().filter(function (r) { return r.p <= pts; }); }
function byId(id) { return DB.clients.filter(function (c) { return c.id === String(id); })[0] || null; }
function findClient(q) {
  q = String(q || "").trim().toLowerCase();
  if (!q) return null;
  var ph = normPhone(q);
  return DB.clients.filter(function (c) {
    return c.id === q || (ph.length >= 9 && normPhone(c.phone) === ph) || (c.code || "").toLowerCase() === q;
  })[0] || null;
}
function search(q) {
  q = String(q || "").trim().toLowerCase();
  if (!q) return DB.clients.slice();
  var ph = normPhone(q);
  return DB.clients.filter(function (c) {
    return c.name.toLowerCase().indexOf(q) >= 0 || c.id.indexOf(q) >= 0 ||
      (ph.length >= 3 && normPhone(c.phone).indexOf(ph) >= 0) ||
      (c.email || "").toLowerCase().indexOf(q) >= 0 || (c.code || "").toLowerCase().indexOf(q) >= 0;
  });
}
function lastVisit(c) {
  if (c.last_visit) return c.last_visit;
  var b = (c.hist || []).filter(function (h) { return h.k === "buy"; });
  return b.length ? b[0].t : "";
}
/* Le journal ne retient jamais de nom : le numéro suffit, et il disparaît
   avec la fiche quand le client demande son effacement. */
function logIt(m, cid) { DB.log.unshift({ t: today(), m: m, cid: cid || "" }); DB.log = DB.log.slice(0, 120); }
function logLine(l) {
  var c = l.cid ? byId(l.cid) : null;
  return esc(l.m) + (c ? ' <span class="muted">— ' + esc(c.name) + '</span>' : "");
}
function dropLogs(ids) {
  DB.log = DB.log.filter(function (l) { return !l.cid || !ids[l.cid]; });
}
function push(c, h) { c.hist.unshift(h); c.hist.sort(function (a, b) { return a.t < b.t ? 1 : a.t > b.t ? -1 : 0; }); }
/* L'année de naissance n'est ni demandée ni conservée : le jour et le mois
   suffisent au cadeau d'anniversaire. */
function bdayLabel(c) {
  if (!c.bday_day || !c.bday_month) return "—";
  return Number(c.bday_day) + " " + MOIS[Number(c.bday_month) - 1];
}
function bdayThisMonth(c) { return !!c.bday_month && Number(c.bday_month) === new Date().getMonth() + 1; }
function bdayToday(c) {
  return !!c.bday_day && Number(c.bday_month) === new Date().getMonth() + 1
      && Number(c.bday_day) === new Date().getDate();
}
function gotBdayGift(c) {
  if (Store.mode === "supabase") return !!c.gift;
  var y = today().slice(0, 4);
  return (c.hist || []).some(function (h) { return h.k === "gift" && h.t.slice(0, 4) === y; });
}

var scanStream = null, scanTimer = null;

function stopScan() {
  if (scanTimer) { clearTimeout(scanTimer); scanTimer = null; }
  if (scanStream) {
    try { scanStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
    scanStream = null;
  }
}

/* Le lecteur natif du navigateur quand il existe ; sinon on va chercher le
   décodeur, qui n'est téléchargé qu'à ce moment-là et jamais par les clients. */
function makeDecoder() {
  if (window.BarcodeDetector) {
    return window.BarcodeDetector.getSupportedFormats().then(function (f) {
      if (f.indexOf("qr_code") < 0) throw new Error("qr non pris en charge");
      var det = new window.BarcodeDetector({ formats: ["qr_code"] });
      return function (canvas) {
        return det.detect(canvas).then(function (r) { return r.length ? r[0].rawValue : ""; });
      };
    })["catch"](loadDecoder);
  }
  return loadDecoder();
}
function loadDecoder() {
  if (window.jsQR) return Promise.resolve(jsqrRead);
  return new Promise(function (res, rej) {
    var el = document.createElement("script");
    el.src = "scanner.js";
    el.onload = function () { window.jsQR ? res(jsqrRead) : rej(new Error("décodeur illisible")); };
    el.onerror = function () { rej(new Error("décodeur indisponible")); };
    document.head.appendChild(el);
  });
}
function jsqrRead(canvas) {
  var ctx = canvas.getContext("2d");
  var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  var r = window.jsQR(img.data, img.width, img.height, { inversionAttempts: "dontInvert" });
  return Promise.resolve(r ? r.data : "");
}

function scanMsg(t) { var e = document.getElementById("scan-msg"); if (e) e.innerHTML = t; }

/* Quand le scan ne démarre pas, il faut pouvoir dire pourquoi sans deviner. */
var scanDiag = {};
function diagLine(k, v) { scanDiag[k] = v; showDiag(); }
function showDiag() {
  var e = document.getElementById("scan-diag");
  if (!e) return;
  var l = [];
  for (var k in scanDiag) l.push(k + " : " + scanDiag[k]);
  e.textContent = l.join(" · ");
}
function scanEnv() {
  scanDiag = {};
  scanDiag["lecteur natif"] = window.BarcodeDetector ? "oui" : "non";
  scanDiag["api caméra"] = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) ? "oui" : "non";
  scanDiag["page sécurisée"] = window.isSecureContext ? "oui" : "non";
  scanDiag["dans un cadre"] = (window.top !== window.self) ? "oui" : "non";
  try {
    var fp = document.featurePolicy || document.permissionsPolicy;
    if (fp && fp.allowsFeature) scanDiag["caméra autorisée ici"] = fp.allowsFeature("camera") ? "oui" : "non";
  } catch (e) {}
  showDiag();
}

function scanFound(text) {
  var id = idFromScan(text);
  stopScan();
  if (!id) { scanMsg('<span class="err">Ce code ne vient pas d\'une carte de fidélité.</span>'); return false; }
  var c = byId(id);
  if (!c) { scanMsg('<span class="err">Carte n° ' + esc(id) + ' inconnue.</span>'); return false; }
  closeModal();
  S.till = { cid: c.id }; S.tab = "till"; render();
  toast(c.name + " — carte n° " + c.id, "ok");
  return true;
}

function photoOnly(msg) {
  scanMsg(msg);
  var box = document.querySelector(".scan-box");
  if (box) box.style.display = "none";
  // On ne touche pas au contenu du libellé : il abrite le champ photo lui-même.
  var b = document.getElementById("scan-photo-btn");
  if (b) b.className = "btn btn-primary btn-full";
  var t = document.getElementById("scan-photo-txt");
  if (t) t.textContent = "Ouvrir l'appareil photo";
}

function openScanner() {
  modal("Scanner la carte",
    '<div class="scan-box"><video id="scan-video" playsinline webkit-playsinline muted autoplay></video>' +
    '<div class="scan-frame"></div></div>' +
    '<p id="scan-msg" class="small muted">Ouverture de l\'appareil photo…</p>' +
    '<canvas id="scan-canvas" hidden></canvas>' +
    '<div class="btn-row">' +
    '<label id="scan-photo-btn" class="btn btn-sm" style="cursor:pointer">' +
    '<span id="scan-photo-txt">Photo du code</span>' +
    '<input id="scan-file" type="file" accept="image/*" hidden data-act="scan-file"></label>' +
    '<button class="btn btn-sm" data-act="close">Annuler</button></div>' +
    '<p id="scan-diag" class="small muted" style="font-size:12px;opacity:.75;margin-top:4px"></p>',
    { nofocus: true });
  scanEnv();

  // Le décodeur peut demander un aller-retour réseau. Safari, lui, exige que
  // l'appareil photo soit réclamé dans la foulée du geste de l'utilisateur :
  // on lance donc la caméra d'abord, et le décodeur en parallèle.
  var decoder = makeDecoder();
  decoder.then(function () { diagLine("lecteur", "prêt"); },
               function (e) { diagLine("lecteur", "échec (" + ((e && e.message) || "?") + ")"); });

  var video = document.getElementById("scan-video");
  var canvas = document.getElementById("scan-canvas");
  if (!video || !canvas) return;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    photoOnly("Cette page n\'a pas accès à l\'appareil photo. Touchez <b>Photo du code</b> : " +
      "prenez-la, ou choisissez-la dans vos photos. Le résultat est le même.");
    return;
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
    .then(function (st) {
      scanStream = st;
      video.srcObject = st;
      var pl = video.play();                       // iOS ne démarre pas le flux tout seul
      if (pl && pl["catch"]) pl["catch"](function () {});
      scanMsg("Placez le code du client dans le cadre.");
      return decoder.then(function (read) {
        var tick = function () {
          if (!scanStream || !document.getElementById("scan-video")) return;
          if (video.readyState >= 2 && video.videoWidth) {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            read(canvas).then(function (t) {
              if (t && scanFound(t)) return;
              scanTimer = setTimeout(tick, 160);
            })["catch"](function () { scanTimer = setTimeout(tick, 300); });
            return;
          }
          scanTimer = setTimeout(tick, 160);
        };
        tick();
      })["catch"](function () {
        scanMsg("Le lecteur de codes n\'a pas pu être chargé. Saisissez le numéro de carte.");
      });
    })["catch"](function (e) {
      var n = (e && e.name) || "";
      diagLine("caméra", n || "erreur");
      photoOnly(n === "NotAllowedError"
        ? "L\'appareil photo est bloqué sur cette page. Touchez <b>Photo du code</b> : " +
          "prenez la photo ou choisissez-la dans vos photos, ça marche pareil."
        : n === "NotFoundError"
        ? "Aucun appareil photo trouvé. Touchez <b>Photo du code</b>."
        : "L\'appareil photo n\'est pas disponible ici. Touchez <b>Photo du code</b>, " +
          "prenez-la ou choisissez-la dans vos photos.");
    });
}

function scanPhoto(file) {
  scanMsg("Lecture de la photo…");
  makeDecoder().then(function (read) {
    var img = new Image();
    img.onload = function () {
      var canvas = document.getElementById("scan-canvas");
      if (!canvas) return;
      var max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height));
      canvas.width = Math.round(img.width * sc); canvas.height = Math.round(img.height * sc);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      read(canvas).then(function (t) {
        if (!t) { scanMsg('<span class="err">Aucun code lisible sur cette photo. Réessayez de plus près.</span>'); return; }
        scanFound(t);
      })["catch"](function () { scanMsg('<span class="err">Lecture impossible.</span>'); });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = function () { scanMsg('<span class="err">Image illisible.</span>'); };
    img.src = URL.createObjectURL(file);
  })["catch"](function () { scanMsg("Le lecteur de codes n\'est pas disponible."); });
}

function dayOpts(sel) {
  var o = "", i;
  for (i = 1; i <= 31; i++) o += '<option value="' + i + '"' + (Number(sel) === i ? " selected" : "") + '>' + i + '</option>';
  return o;
}
function monthOpts(sel) {
  return MOIS_L.map(function (m, i) {
    return '<option value="' + (i + 1) + '"' + (Number(sel) === i + 1 ? " selected" : "") + '>' + m + '</option>';
  }).join("");
}

/* Les habillages proposés. La clé voyage dans data-style, rien de plus. */
var CARD_STYLES = [
  ["rouge", "Rouge maison"], ["papier", "Papier kraft"], ["ardoise", "Ardoise"],
  ["billot", "Billot"], ["marbre", "Marbre"], ["laurier", "Émail vert"]
];
function styleOf(c) {
  var k = (c && c.style) || (DB.shop && DB.shop.card_style) || "rouge";
  return CARD_STYLES.some(function (x) { return x[0] === k; }) ? k : "rouge";
}
/* Le fer du boucher : un couperet, tracé une fois pour toutes. Le coin avant
   coupé et le manche fin suffisent à le rendre lisible en filigrane. */
/* Sur la carte, la marque en filigrane : le logo de la boutique s'il existe,
   le couperet dessiné sinon. */
/* L'en-tête de la carte. Un logo qui contient déjà le nom de la boutique
   n'a pas à le voir réécrit à côté de lui : il devient l'en-tête, en grand
   et entier — un logo rogné ou réduit au point qu'on n'y lise plus rien ne
   sert à personne. Un logo qui n'est qu'un dessin, lui, accompagne le nom. */
function carteEnTete(sh) {
  var l = shopLogo();
  if (l && DB.shop.logo_fond) {
    return '<div class="loyalty-id"><span class="loyalty-lock">' +
      '<img src="' + esc(l) + '" alt="' + esc(sh.name) + '"></span>' +
      '<span>' + (sh.city ? '<span class="loyalty-city">' + esc(sh.city) + '</span>' : "") +
      '<span class="loyalty-kind">Carte de fidélité</span></span></div>';
  }
  return '<div class="loyalty-id"><span class="loyalty-sign" aria-hidden="true"></span>' +
    '<span><span class="loyalty-shop">' + esc(sh.name) + '</span>' +
    (sh.city ? '<span class="loyalty-city">' + esc(sh.city) + '</span>' : "") +
    '<span class="loyalty-kind">Carte de fidélité</span></span></div>';
}

function cardMark() {
  // Sur la carte, le logo sert de pochoir : il prend la couleur de l'encre du
  // style choisi. Un logo déposé garde en revanche ses couleurs, sur sa
  // plaque — c'est une marque, pas un motif.
  if (shopLogo()) {
    // Déjà en en-tête : pas de second exemplaire en filigrane.
    if (DB.shop.logo_fond) return { cls: "", html: "" };
    return {
      cls: " plaque" + (DB.shop.logo_clair ? " sombre" : ""),
      html: '<img class="cmark-img" src="' + esc(shopLogo()) + '" alt="">'
    };
  }
  return { cls: " pochoir", html: "" };
}
/* Les bords vides d'une image : tout ce qui est transparent, et — pour une
   image sans transparence — tout ce qui est blanc. On garde 2 % de marge pour
   que le dessin ne touche pas le cadre. Si l'image est vide ou d'une seule
   teinte, on la rend telle quelle plutôt que de renvoyer un cadre impossible. */
function encadre(img, w, h) {
  var tout = { x0: 0, y0: 0, x1: w - 1, y1: h - 1, rogne: false, fond: false };
  var cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  var cx = cv.getContext("2d");
  cx.drawImage(img, 0, 0);
  var d;
  try { d = cx.getImageData(0, 0, w, h).data; } catch (e) { return tout; }

  var opaque = true, i;
  for (i = 3; i < d.length; i += 4) { if (d[i] < 250) { opaque = false; break; } }

  /* Le fond d'un logo n'est pas toujours blanc ni transparent : celui de la
     boucherie est noir, et le dessin y est posé en blanc et en rouge. On
     interroge donc les quatre coins. S'ils s'accordent, c'est le fond, quelle
     que soit sa couleur — sinon on rognerait tout sauf le cadre, ou rien. */
  function pix(x, y) { var k = (y * w + x) * 4; return [d[k], d[k + 1], d[k + 2], d[k + 3]]; }
  function proche(a, b) {
    return Math.abs(a[0] - b[0]) < 18 && Math.abs(a[1] - b[1]) < 18 &&
           Math.abs(a[2] - b[2]) < 18 && Math.abs(a[3] - b[3]) < 24;
  }
  var coins = [pix(0, 0), pix(w - 1, 0), pix(0, h - 1), pix(w - 1, h - 1)];
  var uni = opaque && proche(coins[0], coins[1]) && proche(coins[0], coins[2]) &&
            proche(coins[0], coins[3]) ? coins[0] : null;
  /* Un fond blanc n'est pas un fond : c'est du papier. Un logo scanné sur une
     feuille se détoure comme avant, et garde le droit à sa plaque foncée. Un
     fond d'une autre couleur, lui, a été voulu par le graphiste : il fait
     partie du dessin, on le garde et on pose le logo tel quel. */
  var papier = uni && uni[0] > 240 && uni[1] > 240 && uni[2] > 240;
  var propre = !!uni && !papier;
  tout.fond = propre;

  var x0 = w, y0 = h, x1 = -1, y1 = -1, x, y;
  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      i = (y * w + x) * 4;
      var p = [d[i], d[i + 1], d[i + 2], d[i + 3]];
      var encre = uni
        ? !proche(p, uni)
        : (p[3] > 20 && (!opaque || !(p[0] > 240 && p[1] > 240 && p[2] > 240)));
      if (!encre) continue;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < x0 || y1 < y0) return tout;
  var m = Math.round(Math.max(x1 - x0, y1 - y0) * (propre ? 0.06 : 0.02));
  var r = {
    x0: Math.max(0, x0 - m), y0: Math.max(0, y0 - m),
    x1: Math.min(w - 1, x1 + m), y1: Math.min(h - 1, y1 + m),
    fond: propre
  };
  r.rogne = (r.x1 - r.x0 + 1) * (r.y1 - r.y0 + 1) < w * h * 0.92;
  return r;
}

/* Le même logo, essayé sur fond clair et sur fond sombre : c'est le seul
   moyen de voir tout de suite qu'un logo blanc a besoin de sa plaque. */
function logoApercu() {
  if (!shopLogo()) {
    return '<p class="logo-vide">Aucun fichier déposé : c\'est le logo d\'origine, ' +
      'inscrit dans l\'application, qui sert — dans le bandeau et sur les cartes. ' +
      'Déposez un fichier pour le remplacer.</p>';
  }
  var nom = esc(DB.shop.name || "");
  return '<div class="logo-try">' +
    '<div class="box clair">' + markGlyph() + '<span class="nm">' + nom + '</span></div>' +
    '<div class="box sombre">' + markGlyph() + '<span class="nm">' + nom + '</span></div>' +
    '</div>' +
    // Tout ce qui dépend du fichier vit ici : l'aperçu, le réglage du fond et
    // le retrait. Un seul bloc à redessiner quand on dépose un logo, donc
    // aucun de ces trois éléments ne peut rester en retard sur les autres.
    (DB.shop.logo_fond
      ? '<p class="small muted" style="margin-top:11px">Ce logo porte son propre fond : ' +
        'il est posé tel quel, sans plaque ajoutée dessous.</p>'
      : '<div class="field" style="margin-top:13px"><label class="check">' +
        '<input type="checkbox" name="logo_clair"' +
        (DB.shop.logo_clair ? " checked" : "") + ' data-act="logo-clair"> ' +
        'Mon logo est dessiné en blanc ou en couleurs claires</label>' +
        '<span class="hint">Cochez si le logo disparaît sur le fond blanc ci-dessus : ' +
        'l\'application lui posera une plaque foncée dessous.</span></div>') +
    '<button type="button" class="btn btn-sm btn-ghost" data-act="logo-off" ' +
    'style="margin-top:11px">Retirer le logo</button>';
}

function cardHTML(c) {
  var sh = DB.shop;
  return '<div class="loyalty' + (posed ? " posed" : "") + '" data-style="' + styleOf(c) + '">' +
    '<span class="loyalty-mark' + cardMark().cls + '" aria-hidden="true">' + cardMark().html + '</span>' +
    '<div class="loyalty-top">' + carteEnTete(sh) +
    '<span class="tier">' + esc(tierOf(c.lifetime)) + '</span></div>' +
    '<div class="loyalty-rule" aria-hidden="true"></div>' +
    '<div class="loyalty-pts"><b>' + nb(c.points) + '</b><span>points</span></div>' +
    '<div class="loyalty-bas">' +
    '<div class="loyalty-name">' + esc(c.name) + '</div>' +
    '<div class="loyalty-ligne"><span class="loyalty-no">n° ' + esc(c.id) + '</span>' +
    ' · client depuis ' + dShort(c.created) + ' ' + c.created.slice(0, 4) + '</div>' +
    '</div></div>';
}

/* Ce que le client peut faire pour gagner des points sans acheter. Une action
   déjà faite reste affichée, barrée et datée : sans cela on se demande si on
   l'a faite, et on rappuie pour rien. */
function bonusClient(c) {
  var l = bonusActifs();
  if (!l.length) return "";
  var pris = bonusPris(c);
  var lignes = l.map(function (b) {
    var fait = pris[b.k];
    return '<li class="bn-row' + (fait ? " fait" : "") + '">' +
      '<span class="bn-pts">' + (fait ? "✓" : "+" + nb(b.pts)) + '</span>' +
      '<span class="bn-txt"><b>' + esc(b.label) + '</b>' +
      '<span>' + (fait
        ? "Déjà fait" + (typeof fait === "string" ? " le " + dShort(fait) : "") + " — merci."
        : nb(b.pts) + " points, une seule fois") + '</span></span>' +
      (fait
        ? '<a class="btn btn-sm btn-ghost" href="' + esc(b.url) + '" target="_blank" rel="noopener noreferrer">Ouvrir</a>'
        : '<button class="btn btn-sm btn-ink" data-act="bonus-go" data-k="' + esc(b.k) + '" ' +
          'data-u="' + esc(b.url) + '">' + esc(b.verbe) + '</button>') +
      '</li>';
  }).join("");
  return '<section class="panel panel-pad">' +
    '<div class="sect-head"><h2>Gagner des points en plus</h2></div>' +
    '<ul class="bn">' + lignes + '</ul>' +
    '<p class="small muted" style="margin-top:12px">Sans rien acheter : abonnez-vous, ' +
    'donnez votre avis, et les points arrivent sur votre carte.</p></section>';
}

function vCard() {

function doSignup(f) {
  var name = f.name.value.trim(), phone = normPhone(f.phone.value),
      bd = Number(f.bd.value), bm = Number(f.bm.value),
      email = f.email.value.trim(), ref = f.ref.value.trim(),
      ok = f.ok.checked, pub = f.pub.checked,
      sign = f.sign ? f.sign.value : "";
  var box = document.getElementById("signup-err");
  function bad(m) { box.innerHTML = '<p class="err">' + esc(m) + '</p>'; }
  if (name.length < 3 || name.indexOf(" ") < 0) return bad("Indiquez votre nom et votre prénom.");
  if (phone.length < 9) return bad("Numéro de téléphone incomplet.");
  if (email && email.indexOf("@") < 1) return bad("Adresse e-mail invalide.");
  if (!bd || !bm) return bad("Indiquez le jour et le mois de votre anniversaire.");
  if (!signSubstantial(sign)) return bad("Merci de signer dans la case blanche.");
  if (!ok) return bad("Merci de cocher la case d'accord pour créer la carte.");
  if (Store.mode !== "supabase" && DB.clients.some(function (c) { return normPhone(c.phone) === phone; }))
    return bad("Ce téléphone est déjà rattaché à une carte. Utilisez « J'ai déjà une carte ».");

  var parrain = null;
  if (ref && Store.mode !== "supabase") {
    parrain = DB.clients.filter(function (c) { return (c.code || "").toLowerCase() === ref.toLowerCase() || c.id === ref; })[0];
    if (!parrain) return bad("Code parrain inconnu. Laissez le champ vide si vous n'en avez pas.");
  }

  if (Store.mode === "supabase") {
    box.innerHTML = '<p class="small muted">Création en cours…</p>';
    rpc("create_card", { p_name: name, p_phone: phone, p_day: bd, p_month: bm,
                         p_email: email || null, p_ref: ref || null,
                         p_marketing: pub, p_notice: NOTICE_VERSION, p_sign: sign })
      .then(function (r) { delete signCache["f-sign"]; location.replace(cardLink(r.token)); })
      ["catch"](function (e) { bad(errMsg(e)); });
    return;
  }

  var sh = DB.shop;
  DB.seq = (DB.seq || 1000) + 1;
  var id = String(DB.seq);
  var c = {
    id: id, name: name, phone: phone, email: email, bday_day: bd, bday_month: bm,
    sign: sign, signed_at: new Date().toISOString(),
    consent_at: new Date().toISOString(), notice: NOTICE_VERSION,
    marketing: pub, marketing_at: pub ? new Date().toISOString() : null,
    created: today(), points: sh.welcome, lifetime: sh.welcome, spent: 0, visits: 0,
    code: slug(name) + "-" + id, by: parrain ? parrain.id : "", hist: [
      { t: today(), a: 0, p: sh.welcome, w: "Bienvenue — carte créée", k: "welcome" }
    ]
  };
  if (parrain) {
    c.points += sh.godchild; c.lifetime += sh.godchild;
    push(c, { t: today(), a: 0, p: sh.godchild, w: "Parrainé par " + parrain.name, k: "ref" });
    parrain.points += sh.godfather; parrain.lifetime += sh.godfather;
    push(parrain, { t: today(), a: 0, p: sh.godfather, w: "Parrainage de " + name, k: "ref" });
  }
  DB.clients.unshift(c);
  logIt("Carte n° " + id + " créée" + (parrain ? " (parrainée)" : ""), id);
  delete signCache["f-sign"];
  S.cid = id; S.view = "card";
  lsSet(LS_ME, id);
  persist("Bienvenue " + name.split(" ")[0] + " ! Votre carte n° " + id + " est prête.");
}

  return out.sort(function (x, y) { return x.t < y.t ? 1 : -1; });

function chart14() {
  var days = [], i, k, map = {};
  allBuys().forEach(function (b) { map[b.t] = (map[b.t] || 0) + b.a; });
  for (i = 13; i >= 0; i--) {
    var d = new Date(new Date(today()).getTime() - i * 864e5).toISOString().slice(0, 10);
    days.push({ d: d, v: map[d] || 0 });
  }
  var max = Math.max.apply(null, days.map(function (x) { return x.v; }).concat([1]));
  var peakIdx = 0; days.forEach(function (x, j) { if (x.v > days[peakIdx].v) peakIdx = j; });
  var bars = days.map(function (x, j) {
    var h = Math.round(x.v / max * 100);
    return '<div class="bar' + (x.v ? "" : " zero") + '" tabindex="0" role="img" aria-label="' +
      dShort(x.d) + ' : ' + eur(x.v) + '">' +
      '<span class="tip">' + dShort(x.d) + " · " + eur(x.v) + '</span>' +
      '<i style="height:' + (x.v ? Math.max(h, 3) : 2) + '%"></i></div>';
  }).join("");
  var labels = days.map(function (x, j) {
    return '<span>' + (j % 3 === 0 || j === 13 ? x.d.slice(8) : "") + '</span>';
  }).join("");
  var rows = days.map(function (x) { return '<tr><td>' + dFull(x.d) + '</td><td>' + eur(x.v) + '</td></tr>'; }).join("");
  return '<section class="panel panel-pad">' +
    '<div class="sect-head"><h2>Encaissé sur 14 jours</h2><span class="sp"></span>' +
    '<span class="small muted num">pic ' + eur(days[peakIdx].v) + '</span></div>' +
    '<div class="chart"><div class="chart-grid"><i style="top:0"></i><i style="top:50%"></i><i style="bottom:0"></i></div>' +
    bars + '</div><div class="chart-x">' + labels + '</div>' +
    '<table class="sr"><caption>Chiffre encaissé par jour</caption><tbody>' + rows + '</tbody></table>' +
    '</section>';
}

/* Pourquoi les clients sont venus, sur les trois derniers mois. C'est la
   réponse à la seule question qui compte quand on paie des SMS : est-ce que
   ça fait revenir quelqu'un ? Sans réponse, on paie à l'aveugle. */
function venues() {
  var n = {}, total = 0;
  allBuys().forEach(function (b) {
    if (daysAgo(d10(b.t)) > 90) return;
    var r = String(b.w || "").trim();
    if (!r || RAISONS.indexOf(r) < 0) return;
    n[r] = (n[r] || 0) + 1; total++;
  });
  if (!total) {
    return '<section class="panel panel-pad"><div class="sect-head"><h2>Pourquoi ils viennent</h2></div>' +
      '<p class="small muted">Rien à compter pour l\'instant. À chaque encaissement, un appui ' +
      'sur une des raisons suffit — au bout de quelques semaines, vous saurez si les SMS ' +
      'font revenir du monde ou non.</p></section>';
  }
  var lignes = RAISONS.filter(function (r) { return n[r]; })
    .sort(function (a, b) { return n[b] - n[a]; })
    .map(function (r) {
      var part = Math.round(n[r] / total * 100);
      return '<div class="rank-row"><span class="n">' + esc(r) + '</span>' +
        '<span class="v">' + nb(n[r]) + ' · ' + part + ' %</span>' +
        '<span class="b"><i style="width:' + Math.max(3, part) + '%"></i></span></div>';
    }).join("");
  return '<section class="panel panel-pad"><div class="sect-head"><h2>Pourquoi ils viennent</h2>' +
    '<span class="sp"></span><span class="small muted">' + nb(total) + ' passage' +
    (total > 1 ? "s" : "") + ' renseigné' + (total > 1 ? "s" : "") + ' sur 3 mois</span></div>' +
    '<div class="rank">' + lignes + '</div></section>';
}

function vDash() {
  var buys = allBuys(), mk = monthKey(today());
  var mBuys = buys.filter(function (b) { return monthKey(b.t) === mk; });
  var ca = DB.clients.reduce(function (a, c) { return a + c.spent; }, 0);
  var passages = DB.clients.reduce(function (a, c) { return a + c.visits; }, 0);
  var caM = mBuys.reduce(function (a, b) { return a + b.a; }, 0);
  var newM = DB.clients.filter(function (c) { return monthKey(c.created) === mk; }).length;
  var pts = DB.clients.reduce(function (a, c) { return a + c.points; }, 0);
  var used = allMoves().filter(function (m) { return m.k === "reward" && monthKey(m.t) === mk; }).length;
  var bd = DB.clients.filter(bdayThisMonth).length;
  var aReclamer = DB.clients.filter(function (c) { return unlocked(c.points).length; }).length;
  var dormants = DB.clients.filter(function (c) { return c.visits > 0 && daysAgo(lastVisit(c)) > 90; });

  var tiles = [
    ["Clients", nb(DB.clients.length), newM ? '<span class="s up">+' + newM + " ce mois-ci</span>" : '<span class="s">aucun ce mois-ci</span>'],
    ["Passages", nb(passages), '<span class="s">' + nb(mBuys.length) + " ce mois-ci</span>"],
    ["Encaissé", eur0(ca), '<span class="s">' + eur0(caM) + " ce mois-ci</span>"],
    ["Panier moyen", passages ? eur(ca / passages) : "—", '<span class="s">sur ' + nb(passages) + " achats</span>"],
    ["Points en circulation", nb(pts), '<span class="s">' + nb(aReclamer) + " récompense" + (aReclamer > 1 ? "s" : "") + " à réclamer</span>"],
    ["Récompenses utilisées", nb(used), '<span class="s">ce mois-ci · ' + nb(bd) + " anniversaire" + (bd > 1 ? "s" : "") + "</span>"]
  ].map(function (t) {
    return '<div class="tile"><span class="k">' + t[0] + '</span><span class="v">' + t[1] + '</span>' + t[2] + '</div>';
  }).join("");

  var top = DB.clients.slice().sort(function (a, b) { return b.lifetime - a.lifetime; }).slice(0, 6);
  var maxL = top.length ? top[0].lifetime : 1;
  var rank = top.map(function (c) {
    return '<div class="rank-row" data-act="open-client" data-id="' + c.id + '" style="cursor:pointer">' +
      '<span class="n">' + esc(c.name) + '</span>' +
      '<span class="v">' + nb(c.lifetime) + ' pts · ' + eur0(c.spent) + '</span>' +
      '<span class="b"><i style="width:' + Math.max(3, Math.round(c.lifetime / maxL * 100)) + '%"></i></span></div>';
  }).join("");

  var jrn = DB.log.slice(0, 8).map(function (l) {
    return '<li class="jrn-row">' +
      '<span class="num small muted">' + dShort(l.t) + '</span>' +
      '<span class="small">' + logLine(l) + '</span></li>';
  }).join("") || '<li class="empty">Rien pour l\'instant.</li>';

  return '<div class="stack">' +
    (Store.mode === "supabase"
      ? '<div class="frais"><span class="small muted">Chiffres lus dans la base ' +
        esc(majTexte() || "à l\'ouverture") + '.</span><span class="sp"></span>' +
        '<button class="btn btn-sm" data-act="relire">Actualiser</button></div>'
      : "") +
    '<div class="tiles">' + tiles + '</div>' +
    (dormants.length ? '<div class="banner warn"><span aria-hidden="true">!</span><span><b>' + dormants.length +
      ' client' + (dormants.length > 1 ? "s" : "") + ' sans passage depuis plus de 3 mois.</b> ' +
      esc(dormants.slice(0, 4).map(function (c) { return c.name + " (n° " + c.id + ")"; }).join(", ")) +
      (dormants.length > 4 ? "…" : "") + ' — une relance et un petit geste les font revenir.</span></div>' : "") +
    chart14() +
    '<div class="cols">' +
    '<section class="panel panel-pad"><div class="sect-head"><h2>Meilleurs clients</h2>' +
    '<span class="sp"></span><span class="small muted">points cumulés</span></div>' +
    '<div class="rank">' + rank + '</div></section>' +
    '<section class="panel panel-pad"><div class="sect-head"><h2>Journal</h2></div>' +
    '<ul>' + jrn + '</ul></section>' +
    '</div>' + venues() + '</div>';
}

/* ══════════════════════════ 6. Encaisser ══════════════════════════ */

/* On cherche soit par numéro (carte ou téléphone), soit par nom. Le choix
   change le clavier du téléphone : chiffres d'un côté, lettres de l'autre. */
function tillPar() { return S.tillPar === "nom" ? "nom" : "num"; }

/* « Thérèse » doit se trouver en tapant « therese ». On retire les accents
   sans changer la longueur du texte, pour pouvoir surligner au bon endroit. */
function sansAccent(t) {
  return String(t == null ? "" : t).replace(/[^\u0000-\u007f]/g, function (ch) {
    var d = ch.normalize ? ch.normalize("NFD") : ch;
    return d.charCodeAt(0) < 128 ? d.charAt(0) : ch;
  });
}

/* Les clients à proposer pendant la frappe. Six au plus : au-delà, une liste
   qui déroule cache le clavier au lieu d'aider. */
function tillMatch(q, par) {
  q = sansAccent(String(q || "").trim()).toLowerCase();
  var rien = { list: [], total: 0 };
  if (!q) return rien;
  var out;
  if (par === "nom") {
    if (q.length < 2) return rien;
    out = DB.clients.filter(function (c) {
      return sansAccent(c.name).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) {
      // ceux dont un mot du nom commence par ce qu'on tape passent devant
      var A = sansAccent(a.name).toLowerCase(), B = sansAccent(b.name).toLowerCase();
      var da = (A.indexOf(q) === 0 || A.indexOf(" " + q) >= 0) ? 0 : 1;
      var db = (B.indexOf(q) === 0 || B.indexOf(" " + q) >= 0) ? 0 : 1;
      return da - db || a.name.localeCompare(b.name, "fr");
    });
  } else {
    var ph = normPhone(q);
    out = DB.clients.filter(function (c) {
      // le numéro de carte dès le premier chiffre ; le téléphone à partir de
      // quatre, sinon « 06 » proposerait toute la clientèle
      return c.id.indexOf(q) === 0 ||
        (ph.length >= 4 && normPhone(c.phone).indexOf(ph) >= 0) ||
        (c.code || "").toLowerCase().indexOf(q) === 0;
    }).sort(function (a, b) { return a.id.localeCompare(b.id); });
  }
  return { list: out.slice(0, 6), total: out.length };
}

/* Le morceau qui correspond à ce qui est tapé, mis en évidence. */
function surligne(txt, q, par) {
  var brut = String(txt || "");
  q = sansAccent(String(q || "").trim()).toLowerCase();
  if (!q) return esc(brut);
  var i = sansAccent(brut).toLowerCase().indexOf(par === "nom" ? q : normPhone(q));
  if (i < 0 || !q) return esc(brut);
  var n = (par === "nom" ? q : normPhone(q)).length;
  return esc(brut.slice(0, i)) + "<mark>" + esc(brut.slice(i, i + n)) + "</mark>" +
    esc(brut.slice(i + n));
}

function suggHtml(q, par) {
  var qq = String(q || "").trim();
  if (!qq) return "";
  var r = tillMatch(qq, par);
  if (!r.list.length) {
    if (par === "nom" && sansAccent(qq).length < 2)
      return '<p class="sugg-hint">Encore une lettre et les noms s\'affichent.</p>';
    return '<p class="sugg-hint">Aucun client ne correspond à « ' + esc(qq) + ' ».</p>';
  }
  return r.list.map(function (c) {
    return '<button class="sugg-i" type="button" role="option" aria-selected="false" ' +
      'data-act="till-pick" data-id="' + c.id + '">' +
      '<span class="av" aria-hidden="true">' + esc(initials(c.name)) + '</span>' +
      '<span class="who"><b>' + (par === "nom" ? surligne(c.name, qq, par) : esc(c.name)) + '</b>' +
      '<span class="small muted num">n° ' + c.id + ' · ' + esc(prettyPhone(c.phone)) +
      ' · ' + nb(c.points) + ' points</span></span></button>';
  }).join("") +
    (r.total > r.list.length
      ? '<p class="sugg-plus">et ' + nb(r.total - r.list.length) + ' autre' +
        (r.total - r.list.length > 1 ? "s" : "") + ' — précisez votre recherche.</p>'
      : "");
}

function vTill() {
  var c = S.till && S.till.cid ? byId(S.till.cid) : null;
  var sh = DB.shop;
  var par = tillPar(), q = S.tillQ || "";
  var head = '<section class="panel panel-pad stack">' +
    '<div class="sect-head"><h2>Encaisser un achat</h2><span class="sp"></span>' +
    '<span class="small muted">' +
    (par === "nom" ? "Tapez les premières lettres du nom"
      : "Tapez le début du n° de carte ou du téléphone") +
    '</span></div>' +
    '<div class="till-box">' +
    '<div class="seg" role="group" aria-label="Rechercher par">' +
    '<button class="seg-b' + (par === "num" ? " on" : "") + '" type="button" data-act="till-par" ' +
    'data-p="num" aria-pressed="' + (par === "num") + '">Numéro</button>' +
    '<button class="seg-b' + (par === "nom" ? " on" : "") + '" type="button" data-act="till-par" ' +
    'data-p="nom" aria-pressed="' + (par === "nom") + '">Nom</button>' +
    '</div>' +
    '<form class="till-find" data-act="till-find" autocomplete="off">' +
    '<input id="tq" name="q" type="text" data-act="till-live" role="combobox" ' +
    'inputmode="' + (par === "nom" ? "text" : "numeric") + '" autocomplete="off" ' +
    'aria-autocomplete="list" aria-controls="tsugg" aria-expanded="true" ' +
    'aria-label="' + (par === "nom" ? "Nom du client" : "Numéro de carte ou téléphone") + '" ' +
    'placeholder="' + (par === "nom" ? "Marie Lefevre" : "1001 ou 06 12 48 03 77") + '" ' +
    'value="' + esc(q) + '">' +
    '<button class="btn" type="button" data-act="scan">Scanner</button>' +
    '<button class="btn ' + (c ? "" : "btn-ink ") + '" type="submit">Rechercher</button>' +
    (c ? '<button class="btn btn-ghost" type="button" data-act="till-clear">Changer</button>' : "") +
    '</form>' +
    '<div id="tsugg" class="sugg" role="listbox" aria-label="Clients proposés">' +
    suggHtml(q, par) + '</div>' +
    '</div>';

  // Une fois le client trouvé, la recherche n'a plus rien à dire : elle laisse
  // la place au pavé. On la remplace par une ligne « qui, et comment changer ».
  if (c) head = '<section class="panel panel-pad stack">';

  if (!c) {
    var recent = DB.clients.slice().sort(function (a, b) {
      return (lastVisit(b) || "").localeCompare(lastVisit(a) || "");
    }).slice(0, 6).map(function (x) {
      return '<button class="chip" data-act="till-pick" data-id="' + x.id + '">' +
        '<span class="num">' + x.id + '</span> · ' + esc(x.name) + '</button>';
    }).join("");
    return head + '<p class="small muted">Derniers passages</p><div class="chips">' + recent + '</div></section>';
  }

  var un = unlocked(c.points), nx = nextReward(c.points);
  var touches = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    .map(function (t) { return '<button type="button" data-act="pad" data-k="' + t + '">' + t + '</button>'; })
    .join("") +
    '<button type="button" class="aux" data-act="pad" data-k="C" aria-label="Effacer le montant">C</button>' +
    '<button type="button" data-act="pad" data-k="0">0</button>' +
    '<button type="button" class="aux" data-act="pad" data-k="<" aria-label="Corriger le dernier chiffre">⌫</button>';

  return head +
    '<div class="pay">' +
    '<div class="pay-who"><span class="av" aria-hidden="true">' + esc(initials(c.name)) + '</span>' +
    '<span class="who"><b>' + esc(c.name) + '</b>' +
    '<span class="small muted num">n° ' + c.id + ' · ' + nb(c.points) + ' pts · ' +
    nb(c.visits) + ' passage' + (c.visits > 1 ? "s" : "") + '</span></span>' +
    '<button class="btn btn-sm btn-ghost" type="button" data-act="till-clear">Changer</button></div>' +

    (bdayToday(c) ? '<div class="bday"><span aria-hidden="true">🎂</span><span class="grow">' +
      '<b>C\'est son anniversaire aujourd\'hui.</b>' + (gotBdayGift(c) ? " Cadeau déjà offert cette année." : "") + '</span>' +
      (gotBdayGift(c) ? "" : '<button class="btn btn-sm btn-brass" data-act="gift-bday" data-id="' + c.id + '">Offrir ' + nb(sh.birthday) + ' pts</button>') +
      '</div>' : "") +

    (un.length ? '<div class="banner banner-brass">' +
      '<span class="ico" aria-hidden="true">★</span><span class="grow"><b>Récompense disponible :</b> ' +
      esc(un[un.length - 1].label) + '</span>' +
      '<button class="btn btn-sm btn-brass" data-act="use-reward" data-id="' + c.id + '">Utiliser</button></div>' : "") +

    '<form data-act="till-save" class="pay">' +
    '<div class="pay-amt"><span id="pay-v" class="v zero" role="status" aria-live="polite" ' +
    'aria-label="Montant de l\'achat">' + payTexte() + '</span>' +
    '<span id="pay-p" class="p none">' + payPoints(c) + '</span></div>' +
    '<div class="pad">' + touches + '</div>' +

    '<div><p class="small muted" style="margin-bottom:8px">Pourquoi est-il venu ? ' +
    '<span class="muted">(facultatif)</span></p>' +
    '<div class="pay-why" role="group" aria-label="Raison de la venue">' + RAISONS.map(function (r) {
      return '<button type="button" class="chip' + (S.till.why === r ? " on" : "") + '" ' +
        'data-act="pay-why" data-r="' + esc(r) + '" aria-pressed="' + (S.till.why === r) + '">' +
        esc(r) + '</button>';
    }).join("") + '</div></div>' +

    '<p class="small muted" style="text-align:center;margin:2px 0 0">' + nb(sh.ppe) + ' point' +
    (sh.ppe > 1 ? "s" : "") + ' par euro' +
    (nx ? ' · encore ' + nb(nx.p - c.points) + ' pts pour « ' + esc(nx.label) + ' »' : "") + '</p>' +
    '<div class="pay-bar">' +
    '<button id="pay-go" class="btn btn-primary btn-full pay-go" type="submit"' +
    (payCents() ? "" : " disabled") + '>' + payBouton() + '</button></div>' +
    '</form></div></section>';
}

/* Les raisons de la venue. Ce n'est pas de la statistique pour la statistique :
   c'est la seule façon de savoir si les SMS servent à quelque chose, et donc
   s'il faut continuer à les payer. */
var RAISONS = ["Habitué", "A reçu le SMS", "Nouveau client", "Bouche à oreille",
  "Passait devant", "Pour une récompense"];

/* Le montant se tape comme sur un terminal de paiement : les chiffres entrent
   par la droite, en centimes. Pas de virgule à chercher. */
function payCents() { return Number(String(S.till.amt || "").slice(0, 7)) || 0; }
function payTexte() { return eur(payCents() / 100); }
function payPoints(c) {
  var cts = payCents();
  if (!cts) return "Tapez le montant";
  var p = Math.round(cts / 100 * DB.shop.ppe);
  return "+" + nb(p) + " point" + (p > 1 ? "s" : "") + " pour " +
    String((c || {}).name || "").split(" ")[0];
}
function payBouton() {
  return payCents() ? "Encaisser " + payTexte() : "Encaisser";
}
/* On ne redessine que ce qui bouge : redessiner la page à chaque chiffre
   ferait sauter le pavé sous le doigt. */
function payRefresh() {
  var c = byId(S.till.cid);
  var v = document.getElementById("pay-v");
  var p = document.getElementById("pay-p");
  var b = document.getElementById("pay-go");
  if (v) { v.textContent = payTexte(); v.className = "v" + (payCents() ? "" : " zero"); }
  if (p) { p.textContent = payPoints(c); p.className = "p" + (payCents() ? "" : " none"); }
  if (b) { b.textContent = payBouton(); b.disabled = !payCents(); }
}

function tillSave(f) {
  var c = byId(S.till.cid); if (!c) return;
  var cts = payCents();
  if (!cts) { toast("Tapez d\'abord le montant.", "bad"); return; }
  var a = Math.round(cts) / 100;
  var w = S.till.why || "Achat en boutique";
  // La caisse se vide dès l'achat validé : sans cela le même montant reste à
  // l'écran et un second appui le passerait une deuxième fois.
  S.till = {}; S.tillQ = "";
  if (Store.mode === "supabase") {
    return remote(rpc("record_purchase", { p_id: c.id, p_amount: a, p_label: w }, true), function (r) {
      return "+" + r.gagnes + " points pour " + String(r.name).split(" ")[0] + " · solde " + nb(r.points);
    });
  }
  var p = Math.round(a * DB.shop.ppe);
  c.points += p; c.lifetime += p; c.spent = Math.round((c.spent + a) * 100) / 100; c.visits++;
  push(c, { t: today(), a: a, p: p, w: w, k: "buy" });
  logIt("Encaissement " + eur(a) + " — n° " + c.id, c.id);
  var nx = nextReward(c.points);
  persist("+" + p + " points pour " + c.name.split(" ")[0] + " · solde " + nb(c.points) +
    (nx ? " · encore " + nb(nx.p - c.points) + " pts" : " · récompense max atteinte"));
}

/* ══════════════════════════ 7. Fichier clients ══════════════════════════ */

/* ── la sélection ──
   Le boucher coche des clients pour leur écrire. L'application n'envoie rien
   elle-même : elle prépare le message et le passe à l'application de messages
   ou de courrier du téléphone. C'est le boucher qui appuie sur « envoyer ». */

function selIds() {
  var out = [], k;
  for (k in (S.sel || {})) if (S.sel[k] && byId(k)) out.push(k);
  return out;
}
function selClients() { return selIds().map(byId); }
function allPicked(list) {
  return list.length > 0 && list.every(function (c) { return S.sel && S.sel[c.id]; });
}

/* Le bandeau qui apparaît dès qu'une case est cochée. */
function selBar(list) {
  var n = selIds().length;
  if (!n) return "";
  return '<div class="selbar">' +
    '<span class="cnt"><b>' + nb(n) + '</b> client' + (n > 1 ? "s" : "") + ' sélectionné' + (n > 1 ? "s" : "") + '</span>' +
    '<span class="sp"></span>' +
    '<button class="btn btn-sm btn-ink" data-act="msg-open">Écrire à ces clients</button>' +
    '<button class="btn btn-sm" data-act="sel-export">Exporter (CSV)</button>' +
    '<button class="btn btn-sm" data-act="sel-brevo">Exporter pour Brevo</button>' +
    '<button class="btn btn-sm btn-ghost" data-act="sel-none">Tout décocher</button>' +
    '</div>';
}

function vClients() {
  var q = S.q || "", sort = S.sort || "recent";
  var list = search(q);
  var sorters = {
    recent: function (a, b) { return (lastVisit(b) || "0").localeCompare(lastVisit(a) || "0"); },
    points: function (a, b) { return b.points - a.points; },
    spent: function (a, b) { return b.spent - a.spent; },
    visits: function (a, b) { return b.visits - a.visits; },
    name: function (a, b) { return a.name.localeCompare(b.name, "fr"); },
    news: function (a, b) { return b.created.localeCompare(a.created); }
  };
  list = list.sort(sorters[sort] || sorters.recent);

  var rows = list.map(function (c) {
    var lv = lastVisit(c), d = daysAgo(lv);
    var st = !c.visits ? '<span class="pill">jamais venu</span>'
      : d <= 30 ? '<span class="pill good"><i></i>actif</span>'
      : d <= 90 ? '<span class="pill warn"><i></i>' + d + ' j</span>'
      : '<span class="pill crit"><i></i>' + d + ' j</span>';
    var on = !!(S.sel && S.sel[c.id]);
    return '<tr data-act="open-client" data-id="' + c.id + '" tabindex="0"' +
      (on ? ' class="picked"' : "") + '>' +
      '<td class="pick" data-act="pick-client" data-id="' + c.id + '" tabindex="0" ' +
      'role="checkbox" aria-checked="' + on + '" aria-label="Sélectionner ' + esc(c.name) + '">' +
      '<span class="tick"></span></td>' +
      '<td class="no hd-a">' + c.id + '</td>' +
      '<td class="hd-b"><b>' + esc(c.name) + '</b><br><span class="small muted num">' + esc(prettyPhone(c.phone)) + '</span></td>' +
      '<td class="r num c-a" data-l="Points"><b>' + nb(c.points) + '</b></td>' +
      '<td class="r num c-b" data-l="Passages">' + nb(c.visits) + '</td>' +
      '<td class="r num c-c" data-l="D\u00e9pens\u00e9">' + eur(c.spent) + '</td>' +
      '<td class="num small c-d" data-l="Dernier">' + (lv ? dShort(lv) : "—") + '</td>' +
      '<td class="c-st" data-l="Statut">' + st + '</td>' +
      '<td class="num small c-e" data-l="Anniv.">' + bdayLabel(c) + '</td></tr>';
  }).join("") || '<tr><td colspan="9" class="empty">Aucun client ne correspond à « ' + esc(q) + ' ».</td></tr>';

  var opts = [["recent", "Dernier passage"], ["points", "Points"], ["spent", "Total dépensé"],
    ["visits", "Passages"], ["news", "Inscription"], ["name", "Nom"]]
    .map(function (o) { return '<option value="' + o[0] + '"' + (sort === o[0] ? " selected" : "") + '>' + o[1] + '</option>'; }).join("");

  return '<div class="stack">' +
    '<section class="panel panel-pad stack">' +
    '<div class="sect-head"><h2>Fichier clients</h2><span class="sp"></span>' +
    '<span class="small muted">' + nb(list.length) + " / " + nb(DB.clients.length) + ' fiches</span></div>' +
    '<div class="filter-row">' +
    '<input id="cq" type="search" placeholder="Nom, n° de carte, téléphone…" value="' + esc(q) + '" data-act="search-live">' +
    '<select id="csort" data-act="sort">' + opts + '</select>' +
    '<button class="btn" data-act="new-client">Nouvelle carte</button></div>' +
    '<div class="pick-row">' +
    '<button class="btn btn-sm" data-act="pick-all">' +
    (allPicked(list) && list.length ? "Tout décocher" : "Tout cocher") +
    (list.length ? ' (' + nb(list.length) + ')' : "") + '</button>' +
    '<span class="small muted">Cochez des clients pour leur écrire ou les exporter.</span>' +
    '</div>' +
    selBar(list) +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    '<th class="pick" data-act="pick-all" tabindex="0" role="checkbox" ' +
    'aria-checked="' + (allPicked(list) && list.length > 0) + '" aria-label="Tout sélectionner">' +
    '<span class="tick"></span></th>' +
    '<th>N°</th><th>Client</th><th class="r">Points</th><th class="r">Passages</th>' +
    '<th class="r">Dépensé</th><th>Dernier</th><th>Statut</th><th>Anniv.</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="small muted">Touchez une ligne pour ouvrir la fiche, le carré pour la cocher.</p>' +
    '</section></div>';
}

/* Une fiche d'identité se lit en colonnes : l'intitulé à gauche, la valeur à

  var out = rows.filter(Boolean).map(function (r) {
    return '<div class="fact"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
  }).join("");
  return '<div class="facts">' + out + '</div>';
}

/* ── écrire aux clients cochés ──
   Deux natures de message, et elles n'obéissent pas aux mêmes règles.
   • Un message de service — « votre commande est prête », « la boutique est
     fermée jeudi » — se rapporte à ce que le client a demandé. Il part à tout
     le monde.
   • Une offre commerciale ne peut partir qu'aux clients qui l'ont acceptée
     (RGPD art. 6.1.a, et l'article L.34-5 du code des postes pour la
     prospection par SMS). L'application retire donc d'office ceux qui ont
     refusé, et le dit.
   Dans les deux cas c'est l'application de messages du téléphone qui envoie :
   la carte de fidélité ne dispose d'aucun service d'envoi, et n'en veut pas. */

var MSG_MODELES = [
  ["Arrivage", "commercial", "Bonjour, arrivage {quoi} à la boutique cette semaine. À bientôt — {boutique}"],
  ["Promotion", "commercial", "Bonjour, {offre} jusqu'à {jour} à la boutique. À bientôt — {boutique}"],
  ["Récompense à réclamer", "commercial", "Bonjour, vous avez une récompense à réclamer sur votre carte de fidélité. À bientôt — {boutique}"],
  ["Commande prête", "service", "Bonjour, votre commande est prête, vous pouvez passer la retirer. — {boutique}"],
  ["Fermeture", "service", "Bonjour, la boutique sera fermée {quand}. Merci de votre compréhension. — {boutique}"]
];

function msgKind() { return S.msgKind === "commercial" ? "commercial" : "service"; }

/* Qui recevra vraiment, et qui est écarté — la réponse dépend de la nature. */
function msgSplit() {
  var all = selClients();
  var com = msgKind() === "commercial";
  var keep = [], out = [];
  all.forEach(function (c) {
    if (com && !c.marketing) out.push(c); else keep.push(c);
  });
  return { keep: keep, out: out,
    tel: keep.filter(function (c) { return normPhone(c.phone).length >= 9; }),
    mail: keep.filter(function (c) { return (c.email || "").indexOf("@") > 0; }) };
}

function msgText() {
  var t = S.msgText;
  return typeof t === "string" ? t : "";
}

function msgModal() {
  if (!selIds().length) { toast("Cochez d'abord des clients.", "bad"); return; }
  modal("Écrire aux clients cochés", msgBody(), { nofocus: true });
}

function msgBody() {
  var sp = msgSplit(), com = msgKind() === "commercial";
  var modeles = MSG_MODELES.filter(function (m) { return m[1] === msgKind(); })
    .map(function (m, i) {
      return '<button type="button" class="chip" data-act="msg-modele" data-t="' + esc(m[2]) + '">' +
        esc(m[0]) + '</button>';
    }).join("");

  var ecartes = sp.out.length
    ? '<div class="banner warn"><span class="ico" aria-hidden="true">!</span><span class="grow">' +
      '<b>' + nb(sp.out.length) + ' client' + (sp.out.length > 1 ? "s" : "") + ' retiré' +
      (sp.out.length > 1 ? "s" : "") + ' de l\'envoi</b> : ' +
      esc(sp.out.slice(0, 4).map(function (c) { return c.name; }).join(", ")) +
      (sp.out.length > 4 ? "…" : "") + ' n\'' + (sp.out.length > 1 ? "ont" : "a") +
      ' pas accepté de recevoir les offres. La loi interdit de leur en envoyer.' +
      '</span></div>'
    : "";

  return '<div class="stack">' +
    '<div class="field"><label>Nature du message</label>' +
    '<div class="chips">' +
    '<button type="button" class="chip" aria-pressed="' + (!com) + '" data-act="msg-kind" data-k="service">' +
    'Message de service</button>' +
    '<button type="button" class="chip" aria-pressed="' + com + '" data-act="msg-kind" data-k="commercial">' +
    'Offre commerciale</button></div>' +
    '<span class="hint">' + (com
      ? 'Une offre ne part qu\'aux clients qui ont accepté d\'en recevoir. Les autres sont retirés automatiquement.'
      : 'Commande prête, horaires, fermeture : cela répond à une demande du client, tout le monde peut le recevoir.') +
    '</span></div>' +

    ecartes +

    '<div class="field"><label>Modèles</label><div class="chips">' + modeles + '</div>' +
    '<span class="hint">Un modèle remplit le message ; les mots entre accolades sont à remplacer.</span></div>' +

    '<div class="field"><label for="msg-t">Votre message</label>' +
    '<textarea id="msg-t" rows="5" data-act="msg-type" ' +
    'placeholder="Bonjour, …">' + esc(msgText()) + '</textarea>' +
    '<span class="hint"><span class="num">' + msgText().length + '</span> caractères' +
    (msgText().length > 160 ? ' — au-delà de 160, un SMS est facturé double par l\'opérateur.' : '') +
    '</span></div>' +

    '<div class="facts">' +
    '<div class="fact"><span class="k">Destinataires</span><span class="v"><b>' + nb(sp.keep.length) + '</b>' +
      (sp.out.length ? ' <span class="muted">sur ' + nb(sp.keep.length + sp.out.length) + ' cochés</span>' : '') + '</span></div>' +
    '<div class="fact"><span class="k">Par SMS</span><span class="v">' + nb(sp.tel.length) + ' ont un téléphone</span></div>' +
    '<div class="fact"><span class="k">Par e-mail</span><span class="v">' + nb(sp.mail.length) + ' ont une adresse</span></div>' +
    '</div>' +

    (brevoPret()
      ? '<div class="field"><label for="msg-s">Objet du courriel</label>' +
        '<input id="msg-s" data-act="msg-sujet" value="' + esc(S.msgSujet || DB.shop.name) + '"></div>' +
        '<div class="btn-row">' +
        '<button class="btn btn-primary" data-act="brevo-mail"' +
        (sp.mail.length && msgText() ? "" : " disabled") + '>' +
        'Envoyer les courriels (' + nb(sp.mail.length) + ')</button>' +
        '<button class="btn btn-ink" data-act="brevo-sms"' +
        (sp.tel.length && msgText() ? "" : " disabled") + '>' +
        'Envoyer les SMS (' + nb(sp.tel.length) + ')</button>' +
        '</div>' +
        '<div id="msg-out"></div>' +
        '<p class="small muted">Les messages partent par <b>Brevo</b>, au nom de la boutique. ' +
        'Les courriels sont compris dans l\'offre gratuite (300 par jour) ; ' +
        '<b>les SMS sont facturés à l\'unité</b> par Brevo. Le décompte de crédits ' +
        'restants s\'affiche après l\'envoi.</p>' +
        '<hr class="divide">' +
        '<p class="small muted">Ou faites-le à la main, depuis votre téléphone :</p>' +
        '<div class="btn-row">' +
        '<button class="btn btn-sm" data-act="msg-sms"' + (sp.tel.length && msgText() ? "" : " disabled") + '>' +
        'Ouvrir les SMS</button>' +
        '<button class="btn btn-sm" data-act="msg-mail"' + (sp.mail.length && msgText() ? "" : " disabled") + '>' +
        'Ouvrir l\'e-mail</button>' +
        '<button class="btn btn-sm" data-act="msg-copy"' + (sp.tel.length ? "" : " disabled") + '>' +
        'Copier les numéros</button></div>'
      : '<div class="banner"><span class="ico" aria-hidden="true">i</span><span class="grow">' +
        '<b>L\'envoi depuis le site n\'est pas encore activé.</b> Pour l\'instant, ' +
        'l\'application ouvre l\'application de messages de votre téléphone. ' +
        'Une fois Brevo branché, les messages partent d\'ici, au nom de la boutique.' +
        '</span>' +
        (Store.mode === "supabase"
          ? '<button class="btn btn-sm btn-ink" data-act="go-envoi">Activer</button>'
          : "") + '</div>' +
        '<div class="btn-row">' +
        '<button class="btn btn-primary" data-act="msg-sms"' + (sp.tel.length && msgText() ? "" : " disabled") + '>' +
        'Ouvrir les SMS (' + nb(sp.tel.length) + ')</button>' +
        '<button class="btn" data-act="msg-mail"' + (sp.mail.length && msgText() ? "" : " disabled") + '>' +
        'Ouvrir l\'e-mail (' + nb(sp.mail.length) + ')</button>' +
        '<button class="btn" data-act="msg-copy"' + (sp.tel.length ? "" : " disabled") + '>' +
        'Copier les numéros</button>' +
        '</div>' +
        '<div id="msg-out"></div>' +
        '<p class="small muted">L\'application n\'envoie rien elle-même : elle ouvre votre application ' +
        'de messages avec les destinataires et le texte déjà remplis. Vous relisez, vous envoyez. ' +
        'Au-delà d\'une vingtaine de numéros, certains téléphones refusent : envoyez en deux fois. ' +
        'Pour un envoi direct au nom de la boutique, voyez Réglages → Envoi automatique.</p>') +
    '</div>';
}

/* L'envoi par Brevo. Le navigateur n'envoie que des numéros de carte : c'est
   la fonction serveur qui relit les fiches, refait le tri du consentement et
   parle à Brevo. */
function brevoEnvoi(canal) {
  var sp = msgSplit(), txt = msgFinal();
  var cibles = canal === "sms" ? sp.tel : sp.mail;
  var out = document.getElementById("msg-out");
  if (!cibles.length || !txt) return;
  if (out) out.innerHTML = '<p class="small muted">Envoi en cours…</p>';
  var boutons = document.querySelectorAll('[data-act="brevo-mail"], [data-act="brevo-sms"]');
  for (var i = 0; i < boutons.length; i++) boutons[i].disabled = true;

  envoiAppel({
    canal: canal, nature: msgKind(),
    ids: cibles.map(function (c) { return c.id; }),
    sujet: S.msgSujet || DB.shop.name,
    texte: txt
  }).then(function (r) {
    var l = '<div class="banner"><span class="ico" aria-hidden="true">✓</span><span class="grow">' +
      '<b>' + nb(r.envoyes) + ' message' + (r.envoyes > 1 ? "s" : "") + ' parti' +
      (r.envoyes > 1 ? "s" : "") + '.</b>' +
      (r.ecartes ? ' ' + nb(r.ecartes) + ' écarté(s) faute d\'accord.' : "") +
      (r.injoignables ? ' ' + nb(r.injoignables) + ' sans ' +
        (canal === "sms" ? "téléphone utilisable" : "adresse e-mail") + '.' : "") +
      (r.echecs && r.echecs.length
        ? ' <b>' + r.echecs.length + ' en échec</b> : ' + esc(r.echecs[0].raison)
        : "") +
      (typeof r.credits === "number" ? ' Crédits SMS restants : ' + nb(r.credits) + '.' : "") +
      '</span></div>';
    if (out) out.innerHTML = l;
    toast(r.envoyes + " message(s) envoyé(s).", "ok");
    if (Store.mode === "supabase") sbLoadAll()["catch"](function () {});
  })["catch"](function (e) {
    if (out) out.innerHTML = '<p class="err">' + esc(String(e.message || e)) + '</p>';
    var b2 = document.querySelectorAll('[data-act="brevo-mail"], [data-act="brevo-sms"]');
    for (var j = 0; j < b2.length; j++) b2[j].disabled = false;
  });
}

/* Rafraîchit la fenêtre sans la refermer — le texte tapé est conservé. */
function msgRefresh() {
  var box = document.querySelector(".modal-body");
  if (!box) return;
  var t = document.getElementById("msg-t");
  var pos = t ? t.selectionStart : null;
  box.innerHTML = msgBody();
  var t2 = document.getElementById("msg-t");
  if (t2 && pos !== null) { t2.focus(); try { t2.setSelectionRange(pos, pos); } catch (e) {} }
}

function msgFinal() {
  return msgText().replace(/\{boutique\}/g, DB.shop.name);
}

/* On consigne l'envoi, sans les noms ni le texte : ce qui compte pour une
   vérification, c'est qu'un message soit parti, à combien de gens, et de
   quelle nature. Le contenu, lui, est dans le téléphone du boucher. */
function msgTrace(sp, voie) {
  var m = "Message " + (msgKind() === "commercial" ? "commercial" : "de service") +
    " préparé par " + voie + " pour " + (voie === "SMS" ? sp.tel.length : sp.mail.length) +
    " client(s)" + (sp.out.length ? ", " + sp.out.length + " écarté(s) faute d'accord" : "");
  logIt(m);
  if (Store.mode === "supabase") {
    // On n'attend pas la réponse : l'application de messages s'ouvre tout de suite.
    try { sbFetch("/rest/v1/log", { method: "POST", prefer: "return=minimal", body: { m: m } }, true); }
    catch (e) {}
    return;
  }
  // En mode partagé, republier maintenant rechargerait la page en pleine
  // rédaction : on se contente de la copie locale, le journal suivra.
  DB.updated = today();
  if (Store.mode !== "cloud") localSave();
}

/* Ces trois fonctions sont exposées pour les essais automatisés : le navigateur
   refuse de suivre une adresse « sms: » dans un banc de test, il faut donc
   pouvoir vérifier ce qu'elle contient sans l'ouvrir. */
try {
  window.__t_split = msgSplit;
  window.__t_final = msgFinal;
  window.__t_trace = msgTrace;
  window.__t_headFonts = headFonts;
} catch (e) {}

      '<span class="rw-txt"><b>' + esc(c.name) + '</b>' +

function vRef() {
  var sh = DB.shop;
  var parrains = DB.clients.filter(function (p) { return DB.clients.some(function (c) { return c.by === p.id; }); })
    .map(function (p) {
      var f = DB.clients.filter(function (c) { return c.by === p.id; });
      return { p: p, f: f, ca: f.reduce(function (a, c) { return a + c.spent; }, 0) };
    }).sort(function (a, b) { return b.f.length - a.f.length; });
  var total = parrains.reduce(function (a, x) { return a + x.f.length; }, 0);
  var caF = parrains.reduce(function (a, x) { return a + x.ca; }, 0);

  var rows = parrains.map(function (x) {
    return '<tr data-act="open-client" data-id="' + x.p.id + '" tabindex="0">' +
      '<td class="no hd-a">' + x.p.id + '</td><td class="hd-b"><b>' + esc(x.p.name) + '</b><br>' +
      '<span class="small muted num">' + esc(x.p.code) + '</span></td>' +
      '<td class="r num c-a" data-l="Filleuls"><b>' + x.f.length + '</b></td>' +
      '<td class="small c-wide" data-l="Qui">' + esc(x.f.map(function (c) { return c.name; }).join(", ")) + '</td>' +
      '<td class="r num c-b" data-l="Encaiss\u00e9">' + eur0(x.ca) + '</td>' +
      '<td class="r num c-c" data-l="Pts gagn\u00e9s">' + nb(x.f.length * sh.godfather) + '</td></tr>';
  }).join("") || '<tr><td colspan="6" class="empty">Aucun parrainage pour l\'instant.</td></tr>';

  return '<div class="stack">' +
    '<div class="tiles">' +
    '<div class="tile"><span class="k">Parrainages</span><span class="v">' + nb(total) + '</span><span class="s">' +
    nb(parrains.length) + ' parrain' + (parrains.length > 1 ? "s" : "") + ' actif' + (parrains.length > 1 ? "s" : "") + '</span></div>' +
    '<div class="tile"><span class="k">Encaissé via filleuls</span><span class="v">' + eur0(caF) + '</span>' +
    '<span class="s">clients amenés par le bouche-à-oreille</span></div>' +
    '<div class="tile"><span class="k">Points distribués</span><span class="v">' + nb(total * (sh.godfather + sh.godchild)) + '</span>' +
    '<span class="s">' + nb(sh.godfather) + ' au parrain, ' + nb(sh.godchild) + ' au filleul</span></div>' +
    '</div>' +
    '<section class="panel panel-pad"><div class="sect-head"><h2>Qui a parrainé qui</h2></div>' +
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>N°</th><th>Parrain</th><th class="r">Filleuls</th>' +
    '<th>Détail</th><th class="r">Encaissé</th><th class="r">Pts gagnés</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="small muted" style="margin-top:12px">Chaque client a un code personnel (visible sur sa carte). ' +
    'Le filleul le saisit à l\'inscription : les deux sont crédités automatiquement.</p></section></div>';
}

function staleList() {
  var y = Number(DB.shop.retention_years || 3);
  var limit = new Date(new Date(today()).getTime() - y * 365.25 * 864e5).toISOString().slice(0, 10);
  return DB.clients.filter(function (c) { return (lastVisit(c) || c.created) < limit; });
}

/* Des points gagnés hors du comptoir : un abonnement, un avis. Trois actions
   suffisent, ce sont celles qui rapportent à une boutique de quartier. Le
   boucher met son lien et décide du barème ; sans lien, l'action n'existe pas. */
var BONUS = [
  { k: "insta",  label: "Abonnement Instagram", verbe: "Suivre sur Instagram",
    ex: "https://instagram.com/votre_boutique",
    url: "https://www.instagram.com/boucherievatuonesete", pts: 20 },
  { k: "face",   label: "Abonnement Facebook",  verbe: "Suivre sur Facebook",
    ex: "https://facebook.com/votreboutique",
    url: "https://www.facebook.com/share/19Be8YCwWB/", pts: 20 },
  { k: "avis",   label: "Avis sur Google",      verbe: "Laisser un avis Google",
    ex: "https://search.google.com/local/writereview?placeid=…",
    // L'adresse d'avis directe. Le lien que donne Google en le copiant depuis
    // un compte connecté passe par un écran de connexion et transporte un
    // jeton de session : il enverrait chaque client se connecter d'abord.
    url: "https://search.google.com/local/writereview?placeid=ChIJmV20zp81sRIRWLedkjFqJpU",
    pts: 50 }
];

/* Les valeurs d'origine ne servent qu'à remplir le formulaire des réglages, et
   jamais à autoriser quoi que ce soit : ce que voient les clients vient de la
   fiche boutique, la même que celle où la base lit le barème. Sans cela la
   page proposerait une action que la base refuserait de créditer. */
function bonusListe(avecDefauts) {
  var v = (DB.shop && DB.shop.bonus) || [];
  return BONUS.map(function (b) {
    var e = v.filter(function (x) { return x.k === b.k; })[0];
    if (!e && avecDefauts) e = { url: b.url, pts: b.pts };
    e = e || {};
    return { k: b.k, label: e.label || b.label, verbe: b.verbe, ex: b.ex,
             url: e.url || "", pts: Number(e.pts) || 0 };
  });
}
/* Une action est proposée dès qu'elle a un lien et des points. Il y avait une
   case à cocher en plus : elle n'ajoutait rien qu'un oubli possible — on
   remplissait tout, on ne cochait pas, et rien n'apparaissait sans qu'on
   sache pourquoi. */
function bonusActifs() {
  return bonusListe().filter(function (b) { return b.url && b.pts > 0; });
}
function bonusEtat(b) {
  if (b.url && b.pts > 0) return { ok: true, txt: "Proposée aux clients" };
  if (!b.url && !b.pts) return { ok: false, txt: "Pas proposée — remplissez le lien et les points" };
  if (!b.url) return { ok: false, txt: "Pas proposée — il manque le lien" };
  return { ok: false, txt: "Pas proposée — il manque le nombre de points" };
}
function bonusPris(c) {
  var p = {};
  (c && c.hist || []).forEach(function (h) { if (h.k === "bonus" && h.ref) p[h.ref] = h.t || true; });
  return p;
}

/* Appelle la fonction « envoyer » avec le jeton du boucher. */
function envoiAppel(corps) {
  if (!SB.url) return Promise.reject(new Error("Base en ligne non configurée."));
  // Sans session ouverte, la passerelle Supabase rejette l'appel avant même
  // d'atteindre la fonction : autant le dire clairement.
  if (!SB.token) return Promise.reject(new Error("Session expirée. Reconnectez-vous."));
  return fetch(SB.url.replace(/\/+$/, "") + "/functions/v1/envoyer", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: SB.key,
      Authorization: "Bearer " + SB.token
    },
    body: JSON.stringify(corps)
  }).then(function (r) {
    return r.text().then(function (t) {
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch (e) { d = { erreur: t }; }
      if (!r.ok) throw new Error(envoiErr((d && d.erreur) || ("HTTP " + r.status), d));
      return d;
    });
  });
}

/* Vérifie, depuis le navigateur, que la base est bien installée ET bien fermée.
   Chaque contrôle public est fait avec la clé publique, jamais avec la session. */
function diagRun() {
  var out = [];
  var add = function (ok, txt, quoi) { out.push({ ok: ok, txt: txt, quoi: quoi || "" }); };

  return rpc("public_shop", {}).then(function (d) {
    if (d && d.name) { add(true, "Schéma installé — boutique « " + d.name + " »"); return true; }
    add(false, "Le schéma répond mais la fiche boutique est vide.", "schema");
    return true;
  })["catch"](function (e) {
    var m = errMsg(e);
    // On distingue les deux pannes qui se ressemblent à l'écran mais n'ont
    // rien à voir : la base qui n'a pas de schéma, et la clé qui est refusée.
    if (/API key|apikey|JWT|401/i.test(m)) {
      add(false, "La base refuse la clé publique de cette page.", "cle");
    } else if (/does not exist|schema|404|relation/i.test(m)) {
      add(false, "Le schéma n'a jamais été installé dans ce projet.", "schema");
    } else {
      add(false, "Projet injoignable — " + m, "reseau");
    }
    return false;
  }).then(function (schema) {
    // Sans schéma, les contrôles suivants échoueraient pour la mauvaise
    // raison et afficheraient des feux verts trompeurs.
    if (!schema) {
      add(false, "Contrôles de sécurité impossibles tant que le schéma manque.");
      return;
    }
    return sbFetch("/rest/v1/clients?select=id&limit=1", {}, false).then(function () {
      add(false, "ALERTE : le fichier clients est lisible sans connexion.", "schema");
    })["catch"](function () { add(true, "Fichier clients fermé au public"); })
    .then(function () {
      return rpc("record_purchase", { p_id: "0", p_amount: 1, p_label: "contrôle" }, false)
        .then(function () { add(false, "ALERTE : un visiteur peut créditer des points.", "schema"); })
        ["catch"](function (e) {
          var m = (e && e.message) || "";
          if (m === "client_inconnu") add(false, "ALERTE : l'encaissement n'est pas réservé au personnel.", "schema");
          else add(true, "Encaissement réservé au personnel");
        });
    }).then(function () {
      if (!SB.token) { add(true, "Compte boucher : pas connecté ici, contrôle ignoré"); return; }
      return rpc("is_staff", {}, true).then(function (r) {
        add(!!r, r ? "Compte « " + SB.email + " » reconnu comme personnel"
                   : "Compte connecté mais absent de la table staff.", r ? "" : "staff");
      })["catch"](function (e) { add(false, "Contrôle du compte impossible — " + errMsg(e)); });
    });
  }).then(function () { return out; });
}

function csv(rows) {
  return rows.map(function (r) {
    return r.map(function (v) {
      v = String(v == null ? "" : v);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(";");
  }).join("\r\n");
}
/* Le format d'import de Brevo : une colonne EMAIL, une colonne SMS au format
   international, le reste en attributs. On n'y met que les clients qui ont
   accepté les offres — une fois dans Brevo, plus personne ne refait ce tri. */
function csvBrevo(garde) {
  var rows = [["EMAIL", "SMS", "PRENOM", "NOM", "NUM_CARTE", "POINTS", "ANNIVERSAIRE"]];
  var n = 0;
  DB.clients.filter(garde || function () { return true; }).forEach(function (c) {
    if (!c.marketing) return;
    var tel = telInter(c.phone);
    if (!(c.email || "").length && !tel) return;
    var bout = String(c.name || "").trim().split(/\s+/);
    var prenom = bout.shift() || "";
    rows.push([c.email || "", tel || "", prenom, bout.join(" "), c.id, c.points, bdayLabel(c)]);
    n++;
  });
  return { csv: "﻿" + csv(rows), n: n };
}

/* Brevo veut l'indicatif du pays, sans « + » ni espaces. Les fiches sont
   saisies au format français : on complète le 33. Même règle que la fonction
   serveur, pour que l'un ne parte pas sans l'autre. */
function telInter(tel) {
  var t = String(tel || "").replace(/[^0-9+]/g, "").replace(/^00/, "+");
  if (/^\+?33[1-9]\d{8}$/.test(t)) return t.replace(/^\+/, "");
  if (/^0[1-9]\d{8}$/.test(t)) return "33" + t.slice(1);
  if (/^\+?[1-9]\d{9,14}$/.test(t)) return t.replace(/^\+/, "");
  return "";
}

function csvClients(garde) {
  var rows = [["Numero", "Nom", "Telephone", "Email", "Anniversaire", "Inscription", "Points", "Points cumules",
    "Total depense", "Passages", "Dernier passage", "Statut", "Code parrain", "Parraine par",
    "Offres acceptees", "Consentement", "Signee le"]];
  DB.clients.filter(garde || function () { return true; }).forEach(function (c) {
    var p = c.by ? byId(c.by) : null;
    rows.push([c.id, c.name, c.phone, c.email, bdayLabel(c), c.created, c.points, c.lifetime,
      String(c.spent).replace(".", ","), c.visits, lastVisit(c), tierOf(c.lifetime), c.code, p ? p.name : "",
      c.marketing ? "oui" : "non", d10(c.consent_at), d10(c.signed_at)]);
  });
  return "﻿" + csv(rows);
}
function csvBuys() {
  var rows = [["Date", "Numero", "Client", "Type", "Montant", "Points", "Raison de la venue"]];
  var kinds = { buy: "Achat", reward: "Recompense", gift: "Cadeau", ref: "Parrainage", welcome: "Bienvenue", adj: "Ajustement" };
  DB.clients.forEach(function (c) {
    c.hist.forEach(function (h) {
      rows.push([h.t, c.id, c.name, kinds[h.k] || h.k, String(h.a || 0).replace(".", ","), h.p, h.w]);
    });
  });
  rows.sort(function (a, b) { return a[0] === "Date" ? -1 : b[0] === "Date" ? 1 : b[0].localeCompare(a[0]); });
  return "﻿" + csv(rows);
}

function offerFile(name, data) {
  function fallback() {
    modal("Copier le fichier", '<p class="small muted">Le téléchargement direct n\'est pas disponible ici. ' +
      'Sélectionnez tout le texte ci-dessous et collez-le dans un fichier <b>' + esc(name) + '</b>.</p>' +
      '<textarea rows="12" style="font-family:var(--mono);font-size:12px">' + esc(data) + '</textarea>' +
      '<button class="btn btn-primary btn-full" data-act="copy" data-val="' + esc(data).slice(0, 200000) + '">Copier dans le presse-papier</button>');
  }
  var api = window.claude && window.claude.use ? window.claude.use("downloads") : null;
  if (!api) {
    // Site web classique : téléchargement direct.
    try {
      var blob = new Blob([data], { type: "application/octet-stream" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      toast("Fichier téléchargé.", "ok");
      return;
    } catch (e) { return fallback(); }
  }
  api.then(function (d) {
    if (!d) return fallback();
    d.save({ filename: name, data: data }).then(function () { toast("Fichier enregistré.", "ok"); })
    ["catch"](function (e) {
      var c = (e && e.code) || "";
      if (c === "declined") return;
      if (c === "extension_not_enabled" || c === "rejected_extension") {
        d.save({ filename: name.replace(/\.[a-z]+$/, "") + ".txt", data: data })
          .then(function () { toast("Fichier enregistré.", "ok"); })["catch"](fallback);
        return;
      }
      fallback();
    });
  })["catch"](fallback);
}

      ? '<p class="foot" style="margin-bottom:0">Version en ligne : <b class="num">' +
        esc(VERSION) + '</b></p>'
      : "") +
    '<p class="foot"><b>' + esc(DB.shop.name) + '</b> — espace boucher' +
    (Store.readonly ? ' · <b>lecture seule</b> sur cet appareil' : "") + '</p></main>';
}

function vError(msg) {
  return '<main class="client-wrap">' +
    '<section class="hero"><h1>Service indisponible</h1>' +
    '<p>La base de la boutique ne répond pas.</p><div class="hero-rule"></div></section>' +
    '<div class="banner warn"><span aria-hidden="true">!</span><span>' + esc(msg) + '</span></div>' +
    '<button class="btn btn-primary btn-full" data-act="reload">Réessayer</button>' +
    // Le diagnostic doit être atteignable ici : quand la base ne répond pas,
    // personne ne peut se connecter, et c'est précisément le moment où il faut
    // savoir ce qui manque.
    '<button class="btn btn-full" data-act="sb-check">Vérifier l\'installation</button>' +
    '<p class="small muted" style="text-align:center">Le contrôle dit ce qui manque, ' +
    'sans avoir à se connecter.</p>' +
    '</main>';
}

var posed = false;   // la carte s'est déjà présentée une fois

function render() {
  var v = S.view;
  var html = v === "error" ? vError(S.errMsg || "") :
    v === "privacy" ? vPrivacy() : v === "legal" ? vLegal() :
    v === "signup" ? vSignup() : v === "find" ? vFind() : v === "card" ? vCard() :
    v === "admin" ? (S.admin ? vAdmin() : vAdminLogin()) : vHome();
  // Le pochoir des cartes lit le logo dans une propriété CSS : c'est le seul
  // moyen pour une feuille de style fixe de désigner une image variable.
  try {
    document.documentElement.style.setProperty("--logo", 'url("' + logoActif() + '")');
  } catch (e) {}
  document.getElementById("app").innerHTML = topbar() + html;
  saveSession();
  if (S.focusId) {
    var el = document.getElementById(S.focusId);
    if (el) { el.focus(); try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} }
    S.focusId = "";
  }
  window.scrollTo({ top: S.scroll || 0, behavior: "instant" });
  S.scroll = 0;
  posed = true;
  mountSigns();
}

/* Changer d'écran remet la page en haut ; rester sur le même écran conserve
   la position de lecture. Sans cette distinction, ouvrir « Encaisser » depuis
   le bas du fichier clients faisait atterrir au milieu de nulle part. */
function go(view, tab) {
  if (view !== S.view || (tab && tab !== S.tab)) S.scroll = 0;
  S.view = view; if (tab) S.tab = tab;
  closeModal(); render();
}
