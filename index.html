<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>La Carte du Boucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="appstyle">
/* ─────────── reset ─────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,blockquote,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
table{border-collapse:collapse;width:100%}
a{color:inherit}

/* ─────────── tokens ─────────── */
:root{
  --paper:#EFEEEA; --surface:#FFFFFF; --surface-2:#F7F6F2; --surface-3:#EAE8E2;
  --ink:#1A1613; --ink-2:#4C463D; --muted:#7C756B;
  --line:#DEDAD1; --line-2:#C8C2B7;
  --accent:#8C1D2B; --accent-fill:#8C1D2B; --accent-on:#FFF6F3; --accent-soft:#F5E4E4;
  --brass:#8E6C1F; --brass-fill:#A9812F; --brass-soft:#F4EBD7;
  --good:#2E6A4E; --good-soft:#E2EFE7;
  --warn:#8E6212; --warn-soft:#F7ECD6;
  --crit:#A32B22; --crit-soft:#F7E3E0;
  --card-1:#3A1218; --card-2:#20090D; --card-ink:#F6EDE6; --card-rule:#B08A3C;
  --shadow:0 1px 2px rgba(26,22,19,.05), 0 8px 24px -12px rgba(26,22,19,.18);
  --shadow-lift:0 2px 4px rgba(26,22,19,.06), 0 18px 40px -18px rgba(26,22,19,.28);
  --r:14px; --r-sm:9px;
  --display:"Bodoni Moda", "Times New Roman", serif;
  --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121313; --surface:#1B1C1D; --surface-2:#212223; --surface-3:#2A2B2C;
    --ink:#EDE8E1; --ink-2:#C3BCB3; --muted:#8F887E;
    --line:#303132; --line-2:#414243;
    --accent:#E4757E; --accent-fill:#A02434; --accent-on:#FFF1F0; --accent-soft:#331A1D;
    --brass:#D8B366; --brass-fill:#8A6A22; --brass-soft:#2E2718;
    --good:#69B58F; --good-soft:#1B2A23;
    --warn:#D6A44C; --warn-soft:#2C2417;
    --crit:#E4746A; --crit-soft:#2E1B18;
    --card-1:#3E141B; --card-2:#1A070A; --card-ink:#F6EDE6; --card-rule:#B08A3C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#121313; --surface:#1B1C1D; --surface-2:#212223; --surface-3:#2A2B2C;
  --ink:#EDE8E1; --ink-2:#C3BCB3; --muted:#8F887E;
  --line:#303132; --line-2:#414243;
  --accent:#E4757E; --accent-fill:#A02434; --accent-on:#FFF1F0; --accent-soft:#331A1D;
  --brass:#D8B366; --brass-fill:#8A6A22; --brass-soft:#2E2718;
  --good:#69B58F; --good-soft:#1B2A23;
  --warn:#D6A44C; --warn-soft:#2C2417;
  --crit:#E4746A; --crit-soft:#2E1B18;
  --card-1:#3E141B; --card-2:#1A070A; --card-ink:#F6EDE6; --card-rule:#B08A3C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.8);
}

/* ─────────── base ─────────── */
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  line-height:1.5; font-size:16px; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

h1,h2,h3{text-wrap:balance;line-height:1.15}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ─────────── chrome ─────────── */
.topbar{
  position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none}
.mark-glyph{
  width:34px;height:34px;border-radius:8px;flex:none;
  background:linear-gradient(160deg,var(--card-1),var(--card-2));
  color:var(--card-ink);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:17px;
  box-shadow:inset 0 0 0 1px rgba(176,138,60,.55);
}
.mark-txt{min-width:0}
.mark-name{display:block;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.02em;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark-sub{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar-sp{flex:1}

/* ─────────── buttons ─────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:10px;font-weight:600;font-size:14.5px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  transition:background .15s, border-color .15s, transform .06s, box-shadow .15s;
  text-align:center;
}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-on);box-shadow:var(--shadow)}
.btn-primary:hover{background:color-mix(in srgb,var(--accent-fill) 88%, #000);border-color:color-mix(in srgb,var(--accent-fill) 88%, #000)}
.btn-brass{background:var(--brass-fill);border-color:var(--brass-fill);color:#FFF8EA}
.btn-brass:hover{background:color-mix(in srgb,var(--brass-fill) 88%, #000);border-color:color-mix(in srgb,var(--brass-fill) 88%, #000)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 35%, var(--line))}
.btn-danger:hover{background:var(--crit-soft)}
.btn-full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

/* ─────────── forms ─────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],input[type=password],select,textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--surface);transition:border-color .15s, box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:-webkit-autofill,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink);
  -webkit-box-shadow:0 0 0 40px var(--surface) inset;
  caret-color:var(--ink);
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid-2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.check input{margin-top:3px;accent-color:var(--accent-fill);width:16px;height:16px;flex:none}
.err{color:var(--crit);font-size:13px;font-weight:600}

/* ─────────── surfaces ─────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-pad{padding:20px}
.sect-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sect-head h2{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:.01em}
.sect-head .sp{flex:1}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:10px}
.divide{height:1px;background:var(--line);border:0;margin:0}

/* ─────────── client shell ─────────── */
.client-wrap{max-width:520px;margin:0 auto;padding:22px 18px 90px;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:12px 0 4px}
.hero h1{font-family:var(--display);font-size:clamp(30px,8vw,42px);font-weight:600;letter-spacing:.01em}
.hero p{color:var(--ink-2);margin-top:10px;font-size:15.5px;max-width:34ch;margin-inline:auto}
.hero-rule{width:54px;height:2px;background:var(--brass-fill);margin:16px auto 0;border-radius:2px}

/* ─────────── the card ─────────── */
.loyalty{
  position:relative;border-radius:16px;overflow:hidden;color:var(--card-ink);
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 2px, transparent 2px 7px),
    linear-gradient(155deg, var(--card-1) 0%, var(--card-2) 100%);
  box-shadow:var(--shadow-lift), inset 0 0 0 1px rgba(176,138,60,.4);
  padding:20px;
}
.loyalty::after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(176,138,60,.32);border-radius:10px;pointer-events:none;
}
.loyalty-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative}
.loyalty-shop{font-family:var(--display);font-size:15px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.loyalty-city{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.62;margin-top:3px}
.tier{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  padding:5px 9px;border-radius:99px;background:rgba(176,138,60,.16);
  color:#E8C87E;border:1px solid rgba(176,138,60,.5);white-space:nowrap;
}
.loyalty-pts{display:flex;align-items:baseline;gap:9px;margin-top:24px;position:relative}
.loyalty-pts b{font-family:var(--display);font-size:52px;font-weight:600;line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.loyalty-pts span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:600}
.loyalty-name{margin-top:20px;font-size:16px;font-weight:600;letter-spacing:.03em;position:relative}
.loyalty-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px;position:relative}
.loyalty-no{font-family:var(--mono);font-size:21px;letter-spacing:.24em;font-weight:500}
.loyalty-since{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;text-align:right}

/* ─────────── progress rail ─────────── */
.rail-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:9px}
.rail-head strong{font-size:14.5px}
.rail{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.rail-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brass-fill),color-mix(in srgb,var(--brass-fill) 70%, #E0B85F));transition:width .5s cubic-bezier(.2,.7,.3,1)}
.rail-foot{margin-top:9px;font-size:13px;color:var(--muted)}

/* ─────────── rewards ─────────── */
.rw{display:flex;flex-direction:column;gap:8px}
.rw-row{
  display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:11px;
  border:1px solid var(--line);background:var(--surface-2);
}
.rw-row.on{border-color:color-mix(in srgb,var(--brass-fill) 55%, var(--line));background:var(--brass-soft)}
.rw-seal{
  width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:12px;font-weight:600;
  background:var(--surface-3);color:var(--muted);border:1px dashed var(--line-2);
}
.rw-row.on .rw-seal{background:var(--brass-fill);color:#FFF8EA;border:1px solid var(--brass-fill);border-style:solid}
.rw-txt{flex:1;min-width:0}
.rw-txt b{display:block;font-size:14.5px;font-weight:600}
.rw-txt span{font-size:12.5px;color:var(--muted)}
.rw-row.on .rw-txt span{color:var(--brass)}

/* ─────────── receipt ─────────── */
.receipt{font-family:var(--mono);font-size:13px}
.receipt li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.receipt li:last-child{border-bottom:0}
.receipt .d{color:var(--muted);font-size:12px}
.receipt .w{grid-column:2;color:var(--ink-2);font-size:12.5px}
.receipt .a{grid-row:1;grid-column:3;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.receipt .p{grid-row:2;grid-column:3;text-align:right;color:var(--brass);font-size:12px;font-weight:600}
.receipt .p.neg{color:var(--accent)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:14px}

/* ─────────── misc client ─────────── */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:11px;overflow:hidden}
.stat-row div{background:var(--surface);padding:13px 10px;text-align:center}
.stat-row b{display:block;font-family:var(--display);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.codebox{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:13px 15px;border-radius:11px;background:var(--accent-soft);
  border:1px dashed color-mix(in srgb,var(--accent) 40%, var(--line));
}
.codebox .c{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.12em;color:var(--accent)}
.bday{display:flex;gap:11px;align-items:center;padding:13px 15px;border-radius:11px;background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass-fill) 40%, var(--line));font-size:14px}

/* ─────────── admin ─────────── */
.admin-wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px}
.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:20px;scrollbar-width:thin}
.tab{
  padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;
  border:1px solid transparent;transition:background .15s,color .15s;
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:5px}
.tile .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:29px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile .s.up{color:var(--good);font-weight:600}
.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}

/* chart */
.chart{display:flex;align-items:flex-end;gap:2px;height:132px;padding-top:20px;position:relative}
.chart-grid{position:absolute;inset:20px 0 18px;pointer-events:none}
.chart-grid i{position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.75}
.bar{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:4px}
.bar:hover{background:var(--surface-2)}
.bar i{display:block;background:var(--accent-fill);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.bar.zero i{background:var(--line-2)}
.bar:hover i{filter:brightness(1.15)}
.bar .tip{
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-size:11.5px;font-family:var(--mono);
  padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:5;
}
.bar:hover .tip,.bar:focus-visible .tip{opacity:1}
.chart-x{display:flex;gap:2px;margin-top:7px}
.chart-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-family:var(--mono);overflow:hidden}
.chart-peak{position:absolute;top:0;font-size:11px;font-family:var(--mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}

/* ranked bars */
.rank{display:flex;flex-direction:column;gap:9px}
.rank-row{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.rank-row .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-row .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.rank-row .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.rank-row .b i{display:block;height:100%;background:var(--accent-fill);border-radius:3px}

/* table */
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.tbl{font-size:14px;min-width:640px}
.tbl th{
  text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;
}
.tbl th.r,.tbl td.r{text-align:right}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .no{font-family:var(--mono);font-weight:600;letter-spacing:.06em}
.tbl .num{font-size:13.5px}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;
  background:var(--surface-3);color:var(--ink-2);
}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* till */
.till-found{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:11px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 32%, var(--line))}
.till-found .av{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:17px;font-weight:600;flex:none;border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;font-weight:500;transition:background .12s}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-on)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{padding:15px 0;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--mono);font-size:19px;font-weight:500}
.keypad button:hover{background:var(--surface-2)}
.amount-display{
  font-family:var(--display);font-size:44px;font-weight:600;text-align:center;padding:14px 0;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.amount-display.zero{color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,16,14,.5);backdrop-filter:blur(2px);z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.modal{
  background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;box-shadow:var(--shadow-lift);border:1px solid var(--line);
}
@media (min-width:700px){.modal{border-radius:16px}}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{font-family:var(--display);font-size:19px;font-weight:600;flex:1}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:16px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:11px;
  font-size:14px;font-weight:600;box-shadow:var(--shadow-lift);max-width:calc(100vw - 32px);
  animation:rise .25s cubic-bezier(.2,.8,.3,1);
}
.toast.ok{background:#1F5A42;color:#EAF6EF}
.toast.bad{background:#8A2A22;color:#FCEDEA}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

/* banners + footer */
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:11px;font-size:13.5px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.banner.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 32%, var(--line));color:var(--warn)}
.foot{text-align:center;font-size:12px;color:var(--muted);padding:26px 0 0;line-height:1.7}
.foot b{color:var(--ink-2)}
.linklike{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
</style>
</head>

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }

/* Le magasin de données : version publiée partagée, ou copie locale. */
var Store = {
  mode: "local",        // "cloud" = base partagée (toutes les tablettes voient la même)
  api: null,
  readonly: false
};

function embedded() {
  try { return JSON.parse(document.getElementById("db").textContent); }
  catch (e) { return null; }
}

function migrate(d) {
  if (!d || !d.shop) return null;
  d.clients = d.clients || [];
  d.log = d.log || [];
  d.clients.forEach(function (c) { c.hist = c.hist || []; });
  return d;
}

/* Reconstruit le document complet : c'est lui qui devient la nouvelle version publiée. */
function renderDoc(state) {
  var css = document.getElementById("appstyle").textContent;
  var js = document.getElementById("appjs").textContent;
  var json = JSON.stringify(state).replace(/</g, "\\u003c");
  var cfg = "";
  try { cfg = document.getElementById("sbcfg").textContent; } catch (e) { cfg = '{"url":"","key":""}'; }
  return "<!doctype html>\n<html lang=\"fr\">\n<head>\n" + HEAD + "<style id=\"appstyle\">" + css + "</style>\n</head>\n<body>\n" +
    "<div id=\"app\"></div>\n" +
    "<script id=\"sbcfg\" type=\"application/json\">" + cfg + "<\/script>\n" +
    "<script id=\"db\" type=\"application/json\">" + json + "<\/script>\n" +
    "<script id=\"appjs\">" + js + "<\/script>\n</body>\n</html>";
}

function localSave() { lsSet(LS_DB, JSON.stringify(DB)); }

/* Enregistre la base. En mode partagé, la page republie une nouvelle version d'elle-même. */
function persist(flash) {
  if (busy) return;
  DB.updated = today();
  if (Store.mode !== "cloud") {
    localSave();
    render();
    if (flash) toast(flash, "ok");
    return;
  }
  busy = true;
  setBusy(true);
  S.flash = flash || "";
  saveSession();
  Store.api.publish(renderDoc(DB)).then(function () {
    /* la vue est rechargée par la plateforme : rien à faire */
  })["catch"](function (e) {
    busy = false; setBusy(false);
    var code = (e && e.code) || "upstream_error";
    if (code === "conflict") return;                    // une autre vue a publié : rechargement en cours
    if (code === "rate_limited") { toast("Trop d'enregistrements d'affilée. Réessayez dans quelques secondes.", "bad"); return; }
    if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
        code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
      Store.mode = "local"; Store.readonly = true; localSave(); render();
      toast("Enregistré sur cet appareil uniquement (accès en lecture seule).", "ok");
      return;
    }
    toast("Enregistrement impossible : " + code, "bad");
  });
}

function setBusy(on) {
  document.body.style.cursor = on ? "progress" : "";
  var b = document.querySelectorAll("button, input, select, textarea");
  for (var i = 0; i < b.length; i++) { if (on) b[i].setAttribute("disabled", ""); else b[i].removeAttribute("disabled"); }
}

function saveSession() { ssSet(SS, JSON.stringify(S)); }
function loadSession() {
  var d = { view: "home", tab: "dash", cid: "", admin: false, flash: "", till: {} };
  try { var p = JSON.parse(ssGet(SS) || "null"); if (p) for (var k in p) d[k] = p[k]; } catch (e) {}
  return d;
}

/* ══════════════════════════ 1 bis. Base en ligne (Supabase) ══════════════════════════ */

var SB = { url: "", key: "", token: "", refresh: "", email: "" };
var LS_SB = "cdb.sb", LS_AUTH = "cdb.auth";

var ERRS = {
  telephone_deja_utilise: "Ce téléphone est déjà rattaché à une carte.",
  code_parrain_inconnu: "Code parrain inconnu. Laissez le champ vide si vous n'en avez pas.",
  telephone_invalide: "Numéro de téléphone incomplet.",

  date_invalide: "Date de naissance invalide.",
  montant_invalide: "Montant invalide.",
  client_inconnu: "Client introuvable.",
  solde_insuffisant: "Solde de points insuffisant.",
  cadeau_deja_offert: "Le cadeau d'anniversaire a déjà été offert cette année.",
  points_nuls: "Indiquez un nombre de points.",
  acces_refuse: "Ce compte n'est pas autorisé. Ajoutez-le à la table « staff »."
};
function errMsg(e) {
  var m = (e && (e.message || e.msg)) || "";
  if (ERRS[m]) return ERRS[m];
  if (/Failed to fetch|NetworkError/i.test(m)) return "Base en ligne injoignable. Vérifiez la connexion.";
  return m || "Une erreur est survenue.";
}

/* Une date de base peut arriver en « 2026-08-24 » ou en horodatage complet. */
function d10(v) { return v ? String(v).slice(0, 10) : ""; }

function cardLink(token) {
  return location.origin + location.pathname + "?c=" + token;
}
function urlToken() {
  var m = /[?&]c=([0-9a-f-]{36})/i.exec(location.search);
  return m ? m[1] : "";
}

function sbConfig() {
  var c = null;
  try { c = JSON.parse(document.getElementById("sbcfg").textContent); } catch (e) {}
  if (!c || !c.url) { try { c = JSON.parse(lsGet(LS_SB) || "null"); } catch (e) { c = null; } }
  return c && c.url && c.key ? c : null;
}

function sbFetch(path, opts, asUser) {
  opts = opts || {};
  var h = { apikey: SB.key, "Content-Type": "application/json" };
  h.Authorization = "Bearer " + (asUser && SB.token ? SB.token : SB.key);
  if (opts.prefer) h.Prefer = opts.prefer;
  return fetch(SB.url.replace(/\/+$/, "") + path, {
    method: opts.method || "GET", headers: h,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    if (r.status === 204) return null;
    return r.text().then(function (t) {
      var d = null;
      try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
      if (!r.ok) throw { status: r.status, message: (d && (d.message || d.error_description || d.error)) || ("HTTP " + r.status) };
      return d;
    });
  });
}
function rpc(name, args, asUser) {
  return sbFetch("/rest/v1/rpc/" + name, { method: "POST", body: args || {} }, asUser);
}

/* ── compte boucher ── */
function sbLogin(email, pass) {
  return sbFetch("/auth/v1/token?grant_type=password", { method: "POST", body: { email: email, password: pass } })
    .then(function (d) {
      SB.token = d.access_token; SB.refresh = d.refresh_token;
      SB.email = (d.user && d.user.email) || email;
      lsSet(LS_AUTH, JSON.stringify({ t: SB.token, r: SB.refresh, e: SB.email }));
      return d;
    });
}
function sbRestore() {
  var a = null;
  try { a = JSON.parse(lsGet(LS_AUTH) || "null"); } catch (e) {}
  if (!a || !a.r) return Promise.resolve(false);
  SB.token = a.t; SB.refresh = a.r; SB.email = a.e;
  return sbFetch("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: a.r } })
    .then(function (d) {
      SB.token = d.access_token; SB.refresh = d.refresh_token;
      lsSet(LS_AUTH, JSON.stringify({ t: SB.token, r: SB.refresh, e: SB.email }));
      return true;
    })["catch"](function () { lsDel(LS_AUTH); SB.token = ""; return false; });
}
function sbLogout() { lsDel(LS_AUTH); SB.token = ""; SB.refresh = ""; SB.email = ""; }

/* ── lecture ── */
function sbShop() {
  return rpc("public_shop", {}).then(function (d) {
    DB = DB || {}; DB.shop = d || DB.shop; DB.clients = DB.clients || []; DB.log = DB.log || [];
    return d;
  });
}

function sbLoadAll() {
  var since = new Date(new Date(today()).getTime() - 62 * 864e5).toISOString().slice(0, 10);
  var yearStart = today().slice(0, 4) + "-01-01";
  return Promise.all([
    sbFetch("/rest/v1/shop?select=data&id=eq.1", {}, true),
    sbFetch("/rest/v1/clients?select=*&order=id.asc&limit=5000", {}, true),
    sbFetch("/rest/v1/moves?select=client_id,t,amount,points,label,kind&t=gte." + since +
            "&order=t.desc,id.desc&limit=8000", {}, true),
    sbFetch("/rest/v1/moves?select=client_id&kind=eq.gift&t=gte." + yearStart + "&limit=5000", {}, true),
    sbFetch("/rest/v1/log?select=t,m&order=id.desc&limit=40", {}, true)
  ]).then(function (r) {
    var gifts = {};
    (r[3] || []).forEach(function (g) { gifts[g.client_id] = true; });
    DB = {
      v: 1,
      shop: (r[0] && r[0][0] && r[0][0].data) || DB.shop,
      admin: { pin: "" }, seq: 0,
      clients: (r[1] || []).map(function (c) {
        return {
          id: c.id, token: c.token, name: c.name, phone: c.phone, email: c.email || "",
          bday: d10(c.bday), created: d10(c.created), code: c.code,
          points: c.points, lifetime: c.lifetime, spent: Number(c.spent), visits: c.visits,
          last_visit: d10(c.last_visit), by: c.referred_by || "",
          gift: !!gifts[c.id], hist: null
        };
      }),
      recent: (r[2] || []).map(function (m) {
        return { cid: m.client_id, t: d10(m.t), a: Number(m.amount), p: m.points, w: m.label, k: m.kind };
      }),
      log: (r[4] || []).map(function (l) { return { t: d10(l.t), m: l.m }; })
    };
    return DB;
  });
}

/* Historique complet d'une fiche, chargé à l'ouverture. */
function sbHist(id) {
  return sbFetch("/rest/v1/moves?select=t,amount,points,label,kind&client_id=eq." + encodeURIComponent(id) +
                 "&order=t.desc,id.desc&limit=500", {}, true)
    .then(function (r) {
      return (r || []).map(function (m) {
        return { t: d10(m.t), a: Number(m.amount), p: m.points, w: m.label, k: m.kind };
      });
    });
}

function saveShopRemote(sh) {
  return sbFetch("/rest/v1/shop?id=eq.1",
    { method: "PATCH", prefer: "return=minimal", body: { data: sh } }, true);
}

/* Transforme la charge utile de get_card en fiche exploitable par les vues. */
function cardToClient(card, tok) {
  return {
    id: card.id, token: tok, name: card.name, phone: card.phone, email: card.email || "",
    bday: d10(card.bday), created: d10(card.created), code: card.code,

function remoteDone(flash) {
  return sbLoadAll().then(function () {
    busy = false; setBusy(false); closeModal(); render();
    if (flash) toast(flash, "ok");

}
function remoteFail(e) {
  busy = false; setBusy(false);
  if (e && e.status === 401) { sbLogout(); S.admin = false; render(); toast("Session expirée, reconnectez-vous.", "bad"); return; }

}
function remote(promise, flash) {

/* ══════════════════════════ 2. Utilitaires ══════════════════════════ */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function today() { return new Date().toISOString().slice(0, 10); }
function eur(n) { return (Math.round(n * 100) / 100).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €"; }
function eur0(n) { return Math.round(n).toLocaleString("fr-FR") + " €"; }
function nb(n) { return Number(n || 0).toLocaleString("fr-FR"); }
var MOIS = ["janv.", "févr.", "mars", "avril", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
var MOIS_L = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function dShort(iso) { if (!iso) return "—"; var p = iso.split("-"); return Number(p[2]) + " " + MOIS[Number(p[1]) - 1]; }
function dFull(iso) { if (!iso) return "—"; var p = iso.split("-"); return Number(p[2]) + " " + MOIS_L[Number(p[1]) - 1] + " " + p[0]; }
function daysAgo(iso) { if (!iso) return 9999; return Math.round((new Date(today()) - new Date(iso)) / 864e5); }
function initials(n) { return n.trim().split(/\s+/).map(function (w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }
function normPhone(p) { return String(p || "").replace(/[^0-9+]/g, ""); }
function prettyPhone(p) { var s = normPhone(p); return s.length === 10 ? s.replace(/(\d{2})(?=\d)/g, "$1 ").trim() : s; }
function slug(n) { return n.normalize("NFD").replace(/[^A-Za-z]/g, "").slice(0, 3).toUpperCase(); }

function tierOf(life) {
  var t = DB.shop.tiers, cur = t[0];
  for (var i = 0; i < t.length; i++) if (life >= t[i].min) cur = t[i];
  return cur.label;
}
function rewards() { return (DB.shop.rewards || []).slice().sort(function (a, b) { return a.p - b.p; }); }
function nextReward(pts) {
  var r = rewards();
  for (var i = 0; i < r.length; i++) if (r[i].p > pts) return r[i];
  return null;
}
function unlocked(pts) { return rewards().filter(function (r) { return r.p <= pts; }); }
function byId(id) { return DB.clients.filter(function (c) { return c.id === String(id); })[0] || null; }
function findClient(q) {
  q = String(q || "").trim().toLowerCase();
  if (!q) return null;
  var ph = normPhone(q);
  return DB.clients.filter(function (c) {
    return c.id === q || (ph.length >= 9 && normPhone(c.phone) === ph) || (c.code || "").toLowerCase() === q;
  })[0] || null;
}
function search(q) {
  q = String(q || "").trim().toLowerCase();
  if (!q) return DB.clients.slice();
  var ph = normPhone(q);
  return DB.clients.filter(function (c) {
    return c.name.toLowerCase().indexOf(q) >= 0 || c.id.indexOf(q) >= 0 ||
      (ph.length >= 3 && normPhone(c.phone).indexOf(ph) >= 0) ||
      (c.email || "").toLowerCase().indexOf(q) >= 0 || (c.code || "").toLowerCase().indexOf(q) >= 0;
  });
}
function lastVisit(c) {
  if (c.last_visit) return c.last_visit;
  var b = (c.hist || []).filter(function (h) { return h.k === "buy"; });
  return b.length ? b[0].t : "";
}
function logIt(m) { DB.log.unshift({ t: today(), m: m }); DB.log = DB.log.slice(0, 120); }
function push(c, h) { c.hist.unshift(h); c.hist.sort(function (a, b) { return a.t < b.t ? 1 : a.t > b.t ? -1 : 0; }); }
function bdayThisMonth(c) { return c.bday && Number(c.bday.slice(5, 7)) === new Date().getMonth() + 1; }
function bdayToday(c) { return c.bday && c.bday.slice(5) === today().slice(5); }
function gotBdayGift(c) {
  if (Store.mode === "supabase") return !!c.gift;
  var y = today().slice(0, 4);
  return (c.hist || []).some(function (h) { return h.k === "gift" && h.t.slice(0, 4) === y; });
}

function toast(msg, kind) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function () { el.remove(); }, 3800);
}

function doSignup(f) {
  var name = f.name.value.trim(), phone = normPhone(f.phone.value), bday = f.bday.value,
      email = f.email.value.trim(), ref = f.ref.value.trim(), ok = f.ok.checked;
  var box = document.getElementById("signup-err");
  function bad(m) { box.innerHTML = '<p class="err">' + esc(m) + '</p>'; }
  if (name.length < 3 || name.indexOf(" ") < 0) return bad("Indiquez votre nom et votre prénom.");
  if (phone.length < 9) return bad("Numéro de téléphone incomplet.");
  if (email && email.indexOf("@") < 1) return bad("Adresse e-mail invalide.");
  if (!bday) return bad("Indiquez votre date de naissance.");
  if (Number(bday.slice(0, 4)) < 1900 || bday > today()) return bad("Date de naissance invalide.");
  if (!ok) return bad("Merci de cocher la case d'accord pour créer la carte.");
  if (Store.mode !== "supabase" && DB.clients.some(function (c) { return normPhone(c.phone) === phone; }))
    return bad("Ce téléphone est déjà rattaché à une carte. Utilisez « J'ai déjà une carte ».");

  var parrain = null;
  if (ref && Store.mode !== "supabase") {
    parrain = DB.clients.filter(function (c) { return (c.code || "").toLowerCase() === ref.toLowerCase() || c.id === ref; })[0];
    if (!parrain) return bad("Code parrain inconnu. Laissez le champ vide si vous n'en avez pas.");
  }

  if (Store.mode === "supabase") {
    box.innerHTML = '<p class="small muted">Création en cours…</p>';
    rpc("create_card", { p_name: name, p_phone: phone, p_bday: bday,
                         p_email: email || null, p_ref: ref || null })
      .then(function (r) { location.replace(cardLink(r.token)); })
      ["catch"](function (e) { bad(errMsg(e)); });
    return;
  }

  var sh = DB.shop;
  DB.seq = (DB.seq || 1000) + 1;
  var id = String(DB.seq);
  var c = {
    id: id, name: name, phone: phone, email: email, bday: bday,
    created: today(), points: sh.welcome, lifetime: sh.welcome, spent: 0, visits: 0,
    code: slug(name) + "-" + id, by: parrain ? parrain.id : "", hist: [
      { t: today(), a: 0, p: sh.welcome, w: "Bienvenue — carte créée", k: "welcome" }
    ]
  };
  if (parrain) {
    c.points += sh.godchild; c.lifetime += sh.godchild;
    push(c, { t: today(), a: 0, p: sh.godchild, w: "Parrainé par " + parrain.name, k: "ref" });
    parrain.points += sh.godfather; parrain.lifetime += sh.godfather;
    push(parrain, { t: today(), a: 0, p: sh.godfather, w: "Parrainage de " + name, k: "ref" });
  }
  DB.clients.unshift(c);
  logIt("Carte n° " + id + " créée — " + name + (parrain ? " (parrain " + parrain.name + ")" : ""));
  S.cid = id; S.view = "card";
  lsSet(LS_ME, id);
  persist("Bienvenue " + name.split(" ")[0] + " ! Votre carte n° " + id + " est prête.");
}

/* ══════════════════════════ 5. Espace boucher — statistiques ══════════════════════════ */

/* Mouvements récents, quelle que soit la source : historique en mémoire
   (hors ligne) ou fenêtre glissante de 60 jours (base en ligne). */
function allMoves() {
  var out = [];
  if (Store.mode === "supabase") {
    (DB.recent || []).forEach(function (m) {
      out.push({ t: m.t, a: m.a, p: m.p, w: m.w, k: m.k, c: byId(m.cid) });
    });
  } else {
    DB.clients.forEach(function (c) {
      (c.hist || []).forEach(function (h) {
        out.push({ t: h.t, a: h.a, p: h.p, w: h.w, k: h.k, c: c });
      });
    });
  }
  return out.sort(function (x, y) { return x.t < y.t ? 1 : -1; });
}
function allBuys() { return allMoves().filter(function (m) { return m.k === "buy"; }); }
function monthKey(d) { return d.slice(0, 7); }

function vAdminLogin() {
  return '<main class="client-wrap">' +
    '<section class="hero"><p class="eyebrow">Accès réservé</p><h1>Espace boucher</h1>' +

    '<form class="panel panel-pad stack" data-act="login">' +
    (Store.mode === "supabase"
      ? '<div class="field"><label for="mail">Adresse e-mail</label>' +
        '<input id="mail" name="mail" type="email" autocomplete="username" required></div>' +
        '<div class="field"><label for="pin">Mot de passe</label>' +
        '<input id="pin" name="pin" type="password" autocomplete="current-password" required></div>'
      : '<div class="field"><label for="pin">Code d\'accès</label>' +
        '<input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" required></div>') +
    '<div id="login-err"></div>' +
    '<button class="btn btn-primary btn-full" type="submit">Entrer</button>' +
    '<button class="btn btn-ghost btn-full" type="button" data-act="home">Retour</button>' +
    '</form>' + footer() + '</main>';
}

function chart14() {
  var days = [], i, k, map = {};
  allBuys().forEach(function (b) { map[b.t] = (map[b.t] || 0) + b.a; });
  for (i = 13; i >= 0; i--) {
    var d = new Date(new Date(today()).getTime() - i * 864e5).toISOString().slice(0, 10);
    days.push({ d: d, v: map[d] || 0 });
  }
  var max = Math.max.apply(null, days.map(function (x) { return x.v; }).concat([1]));
  var peakIdx = 0; days.forEach(function (x, j) { if (x.v > days[peakIdx].v) peakIdx = j; });
  var bars = days.map(function (x, j) {
    var h = Math.round(x.v / max * 100);
    return '<div class="bar' + (x.v ? "" : " zero") + '" tabindex="0" role="img" aria-label="' +
      dShort(x.d) + ' : ' + eur(x.v) + '">' +
      '<span class="tip">' + dShort(x.d) + " · " + eur(x.v) + '</span>' +
      '<i style="height:' + (x.v ? Math.max(h, 3) : 2) + '%"></i></div>';
  }).join("");
  var labels = days.map(function (x, j) {
    return '<span>' + (j % 3 === 0 || j === 13 ? x.d.slice(8) : "") + '</span>';
  }).join("");
  var rows = days.map(function (x) { return '<tr><td>' + dFull(x.d) + '</td><td>' + eur(x.v) + '</td></tr>'; }).join("");
  return '<section class="panel panel-pad">' +
    '<div class="sect-head"><h2>Encaissé sur 14 jours</h2><span class="sp"></span>' +
    '<span class="small muted num">pic ' + eur(days[peakIdx].v) + '</span></div>' +
    '<div class="chart"><div class="chart-grid"><i style="top:0"></i><i style="top:50%"></i><i style="bottom:0"></i></div>' +
    bars + '</div><div class="chart-x">' + labels + '</div>' +
    '<table class="sr"><caption>Chiffre encaissé par jour</caption><tbody>' + rows + '</tbody></table>' +
    '</section>';
}

function vDash() {
  var buys = allBuys(), mk = monthKey(today());
  var mBuys = buys.filter(function (b) { return monthKey(b.t) === mk; });
  var ca = DB.clients.reduce(function (a, c) { return a + c.spent; }, 0);
  var passages = DB.clients.reduce(function (a, c) { return a + c.visits; }, 0);
  var caM = mBuys.reduce(function (a, b) { return a + b.a; }, 0);
  var newM = DB.clients.filter(function (c) { return monthKey(c.created) === mk; }).length;
  var pts = DB.clients.reduce(function (a, c) { return a + c.points; }, 0);
  var used = allMoves().filter(function (m) { return m.k === "reward" && monthKey(m.t) === mk; }).length;
  var bd = DB.clients.filter(bdayThisMonth).length;
  var aReclamer = DB.clients.filter(function (c) { return unlocked(c.points).length; }).length;
  var dormants = DB.clients.filter(function (c) { return c.visits > 0 && daysAgo(lastVisit(c)) > 90; });

  var tiles = [
    ["Clients", nb(DB.clients.length), newM ? '<span class="s up">+' + newM + " ce mois-ci</span>" : '<span class="s">aucun ce mois-ci</span>'],
    ["Passages", nb(passages), '<span class="s">' + nb(mBuys.length) + " ce mois-ci</span>"],
    ["Encaissé", eur0(ca), '<span class="s">' + eur0(caM) + " ce mois-ci</span>"],
    ["Panier moyen", passages ? eur(ca / passages) : "—", '<span class="s">sur ' + nb(passages) + " achats</span>"],
    ["Points en circulation", nb(pts), '<span class="s">' + nb(aReclamer) + " client" + (aReclamer > 1 ? "s" : "") + " ont une récompense à réclamer</span>"],
    ["Récompenses ce mois", nb(used), '<span class="s">' + nb(bd) + " anniversaire" + (bd > 1 ? "s" : "") + " ce mois</span>"]
  ].map(function (t) {
    return '<div class="tile"><span class="k">' + t[0] + '</span><span class="v">' + t[1] + '</span>' + t[2] + '</div>';
  }).join("");

  var top = DB.clients.slice().sort(function (a, b) { return b.lifetime - a.lifetime; }).slice(0, 6);
  var maxL = top.length ? top[0].lifetime : 1;
  var rank = top.map(function (c) {
    return '<div class="rank-row" data-act="open-client" data-id="' + c.id + '" style="cursor:pointer">' +
      '<span class="n">' + esc(c.name) + '</span>' +
      '<span class="v">' + nb(c.lifetime) + ' pts · ' + eur0(c.spent) + '</span>' +
      '<span class="b"><i style="width:' + Math.max(3, Math.round(c.lifetime / maxL * 100)) + '%"></i></span></div>';
  }).join("");

  var jrn = DB.log.slice(0, 8).map(function (l) {
    return '<li style="display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)">' +
      '<span class="num small muted" style="flex:none;width:58px">' + dShort(l.t) + '</span>' +
      '<span class="small">' + esc(l.m) + '</span></li>';
  }).join("") || '<li class="empty">Rien pour l\'instant.</li>';

  return '<div class="stack">' +
    '<div class="tiles">' + tiles + '</div>' +
    (dormants.length ? '<div class="banner warn"><span aria-hidden="true">!</span><span><b>' + dormants.length +
      ' client' + (dormants.length > 1 ? "s" : "") + ' sans passage depuis plus de 3 mois.</b> ' +
      esc(dormants.slice(0, 4).map(function (c) { return c.name + " (n° " + c.id + ")"; }).join(", ")) +
      (dormants.length > 4 ? "…" : "") + ' — une relance et un petit geste les font revenir.</span></div>' : "") +
    chart14() +
    '<div class="cols">' +
    '<section class="panel panel-pad"><div class="sect-head"><h2>Meilleurs clients</h2>' +
    '<span class="sp"></span><span class="small muted">points cumulés</span></div>' +
    '<div class="rank">' + rank + '</div></section>' +
    '<section class="panel panel-pad"><div class="sect-head"><h2>Journal</h2></div>' +
    '<ul>' + jrn + '</ul></section>' +
    '</div></div>';
}

function tillSave(f) {
  var c = byId(S.till.cid); if (!c) return;
  var raw = String(f.amt.value).replace(/\s/g, "").replace(",", ".");
  var a = parseFloat(raw);
  if (!(a > 0)) { toast("Montant invalide.", "bad"); return; }
  a = Math.round(a * 100) / 100;
  var w = f.w.value.trim() || "Achat en boutique";
  if (Store.mode === "supabase") {
    return remote(rpc("record_purchase", { p_id: c.id, p_amount: a, p_label: w }, true), function (r) {
      return "+" + r.gagnes + " points pour " + String(r.name).split(" ")[0] + " · solde " + nb(r.points);
    });
  }
  var p = Math.round(a * DB.shop.ppe);
  c.points += p; c.lifetime += p; c.spent = Math.round((c.spent + a) * 100) / 100; c.visits++;
  push(c, { t: today(), a: a, p: p, w: w, k: "buy" });
  logIt("Encaissement " + eur(a) + " — n° " + c.id + " (" + c.name + ")");
  var nx = nextReward(c.points);
  persist("+" + p + " points pour " + c.name.split(" ")[0] + " · solde " + nb(c.points) +
    (nx ? " · encore " + nb(nx.p - c.points) + " pts" : " · récompense max atteinte"));
}

function csv(rows) {
  return rows.map(function (r) {
    return r.map(function (v) {
      v = String(v == null ? "" : v);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }).join(";");
  }).join("\r\n");
}
function csvClients() {
  var rows = [["Numero", "Nom", "Telephone", "Email", "Naissance", "Inscription", "Points", "Points cumules",
    "Total depense", "Passages", "Dernier passage", "Statut", "Code parrain", "Parraine par"]];
  DB.clients.forEach(function (c) {
    var p = c.by ? byId(c.by) : null;
    rows.push([c.id, c.name, c.phone, c.email, c.bday, c.created, c.points, c.lifetime,
      String(c.spent).replace(".", ","), c.visits, lastVisit(c), tierOf(c.lifetime), c.code, p ? p.name : ""]);
  });
  return "﻿" + csv(rows);
}
function csvBuys() {
  var rows = [["Date", "Numero", "Client", "Type", "Montant", "Points", "Detail"]];
  var kinds = { buy: "Achat", reward: "Recompense", gift: "Cadeau", ref: "Parrainage", welcome: "Bienvenue", adj: "Ajustement" };
  DB.clients.forEach(function (c) {
    c.hist.forEach(function (h) {
      rows.push([h.t, c.id, c.name, kinds[h.k] || h.k, String(h.a || 0).replace(".", ","), h.p, h.w]);
    });
  });
  rows.sort(function (a, b) { return a[0] === "Date" ? -1 : b[0] === "Date" ? 1 : b[0].localeCompare(a[0]); });
  return "﻿" + csv(rows);
}

function offerFile(name, data) {
  function fallback() {
    modal("Copier le fichier", '<p class="small muted">Le téléchargement direct n\'est pas disponible ici. ' +
      'Sélectionnez tout le texte ci-dessous et collez-le dans un fichier <b>' + esc(name) + '</b>.</p>' +
      '<textarea rows="12" style="font-family:var(--mono);font-size:12px">' + esc(data) + '</textarea>' +
      '<button class="btn btn-primary btn-full" data-act="copy" data-val="' + esc(data).slice(0, 200000) + '">Copier dans le presse-papier</button>');
  }
  var api = window.claude && window.claude.use ? window.claude.use("downloads") : null;
  if (!api) return fallback();
  api.then(function (d) {
    if (!d) return fallback();
    d.save({ filename: name, data: data }).then(function () { toast("Fichier enregistré.", "ok"); })
    ["catch"](function (e) {
      var c = (e && e.code) || "";
      if (c === "declined") return;
      if (c === "extension_not_enabled" || c === "rejected_extension") {
        d.save({ filename: name.replace(/\.[a-z]+$/, "") + ".txt", data: data })
          .then(function () { toast("Fichier enregistré.", "ok"); })["catch"](fallback);
        return;
      }
      fallback();
    });
  })["catch"](fallback);
}

    if (Store.mode === "supabase")
      return remote(rpc("gift_birthday", { p_id: c.id }, true), function (r) {
        return "Joyeux anniversaire ! " + r.offerts + " points offerts à " + c.name.split(" ")[0] + ".";
      });
    var p = DB.shop.birthday;
    c.points += p; c.lifetime += p;
    push(c, { t: today(), a: 0, p: p, w: "Cadeau d'anniversaire", k: "gift" });
    logIt("Cadeau anniversaire — n° " + c.id + " (" + c.name + ")");
    closeModal(); persist("Joyeux anniversaire ! " + p + " points offerts à " + c.name.split(" ")[0] + ".");
  },
  "use-reward": function (el) {
    var c = byId(el.dataset.id); if (!c) return;
    var un = unlocked(c.points);
    if (!un.length) return toast("Aucune récompense disponible.", "bad");
    var opts = un.map(function (r, i) {
      return '<button class="btn btn-full" style="justify-content:space-between" data-act="do-reward" data-id="' + c.id +
        '" data-p="' + r.p + '" data-l="' + esc(r.label) + '"><span>' + esc(r.label) + '</span>' +
        '<span class="num">−' + r.p + ' pts</span></button>';
    }).join("");
    modal("Utiliser une récompense", '<p class="small muted">Solde : <b class="num">' + nb(c.points) +
      ' points</b>. Les points sont retirés à la validation.</p><div class="stack-sm">' + opts + '</div>');
  },
  "do-reward": function (el) {
    var c = byId(el.dataset.id), p = Number(el.dataset.p), l = el.dataset.l;
    if (!c || c.points < p) return toast("Solde insuffisant.", "bad");
    if (Store.mode === "supabase")
      return remote(rpc("use_reward", { p_id: c.id, p_points: p, p_label: l }, true), function (r) {
        return "Récompense validée : " + l + " · nouveau solde " + nb(r.points) + " pts";
      });
    c.points -= p;
    push(c, { t: today(), a: 0, p: -p, w: l, k: "reward" });
    logIt("Récompense « " + l + " » — n° " + c.id);
    closeModal(); persist("Récompense validée : " + l + " · nouveau solde " + nb(c.points) + " pts");
  },
  "del-client": function (el) {
    var c = byId(el.dataset.id);
    modal("Supprimer la fiche", '<p>Supprimer définitivement <b>' + esc(c.name) + '</b> (n° ' + c.id + ') ' +
      'et ses ' + c.hist.length + ' mouvements ? Cette action est irréversible.</p>' +
      '<div class="btn-row"><button class="btn btn-danger" data-act="do-del" data-id="' + c.id + '">Supprimer</button>' +
      '<button class="btn" data-act="close">Annuler</button></div>');
  },
  "do-del": function (el) {
    var c = byId(el.dataset.id);
    if (Store.mode === "supabase")
      return remote(sbFetch("/rest/v1/clients?id=eq." + encodeURIComponent(c.id),
        { method: "DELETE", prefer: "return=minimal" }, true), "Fiche supprimée.");
    DB.clients = DB.clients.filter(function (x) { return x.id !== c.id; });
    DB.clients.forEach(function (x) { if (x.by === c.id) x.by = ""; });
    logIt("Fiche n° " + c.id + " supprimée");
    closeModal(); persist("Fiche supprimée.");
  },
  "add-reward": function () {
    var l = document.getElementById("rw-list");
    var d = document.createElement("div");
    d.style.cssText = "display:flex;gap:10px;align-items:center";
    d.innerHTML = '<input name="p" type="number" step="10" min="1" value="100" style="width:110px" aria-label="Points">' +
      '<input name="l" value="" placeholder="Ce que le client gagne" style="flex:1" aria-label="Récompense">' +
      '<button class="btn btn-sm btn-danger" type="button" data-act="drop-row" aria-label="Supprimer">✕</button>';
    l.appendChild(d); d.querySelector('input[name=l]').focus();
  },
  "del-reward": function (el) { el.parentNode.remove(); },
  "drop-row": function (el) { el.parentNode.remove(); },
  "export-clients": function () { offerFile("clients-fidelite.csv", csvClients()); },
  "export-buys": function () { offerFile("achats-fidelite.csv", csvBuys()); },
  "backup": function () { offerFile("sauvegarde-fidelite.json", JSON.stringify(DB, null, 1)); },
  "restore": function () { restoreModal(); },
  "wipe-demo": function () {
    DB.clients = DB.clients.filter(function (c) { return !c.demo; });
    logIt("Fiches de démonstration effacées");
    persist("Fiches de démonstration effacées.");
  },
  "wipe-all": function () {
    modal("Tout effacer", '<p>Supprimer <b>' + DB.clients.length + ' fiches</b> et tout l\'historique ? ' +
      'Faites d\'abord une sauvegarde.</p><div class="btn-row">' +
      '<button class="btn btn-danger" data-act="do-wipe">Oui, tout effacer</button>' +
      '<button class="btn" data-act="close">Annuler</button></div>');
  },
  "do-wipe": function () {
    if (Store.mode === "supabase")
      return remote(sbFetch("/rest/v1/clients?id=not.is.null",
        { method: "DELETE", prefer: "return=minimal" }, true), "Base vidée.");
    DB.clients = []; DB.log = []; DB.seq = 1000;
    closeModal(); persist("Base vidée.");
  },
  "pick-file": function (el) {
    var f = el.files && el.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { var t = document.getElementById("r-txt"); if (t) t.value = r.result; };
    r.readAsText(f);
  }
};

/* ── formulaires ── */
var FORMS = {
  "find": function (f) {
    var box = document.getElementById("find-err");
    if (Store.mode === "supabase") {
      box.innerHTML = '<p class="small muted">Recherche…</p>';
      rpc("find_card", { p_phone: f.q.value, p_bday: f.bd.value }).then(function (r) {
        if (!r || !r.token) {
          box.innerHTML = '<p class="err">Aucune carte à ce téléphone avec cette date de naissance. ' +
            'Demandez au boucher, il peut retrouver votre fiche.</p>';
          return;
        }
        location.replace(cardLink(r.token));
      })["catch"](function (e) { box.innerHTML = '<p class="err">' + esc(errMsg(e)) + '</p>'; });
      return;
    }
    var c = findClient(f.q.value) || search(f.q.value)[0];
    if (!c) { box.innerHTML = '<p class="err">Aucune carte trouvée. Vérifiez le numéro ou créez votre carte.</p>'; return; }
    S.cid = c.id; lsSet(LS_ME, c.id); go("card");
  },
  "signup": doSignup,
  "login": function (f) {
    var box = document.getElementById("login-err");
    if (Store.mode === "supabase") {
      box.innerHTML = '<p class="small muted">Connexion…</p>';
      sbLogin(f.mail.value.trim(), f.pin.value)
        .then(function () { return sbLoadAll(); })
        .then(function () { S.admin = true; S.tab = "dash"; render(); toast("Bonjour.", "ok"); })
        ["catch"](function (e) {
          sbLogout();
          box.innerHTML = '<p class="err">' + esc(e && e.status === 400
            ? "E-mail ou mot de passe incorrect." : errMsg(e)) + '</p>';
        });
      return;
    }
    if (String(f.pin.value) === String(DB.admin.pin)) { S.admin = true; S.tab = "dash"; render(); }
    else box.innerHTML = '<p class="err">Code incorrect.</p>';
  },
  "till-find": function (f) {
    var q = f.q.value, c = findClient(q) || search(q)[0];
    if (!c) { toast("Aucun client pour « " + q + " ».", "bad"); return; }
    S.till = { cid: c.id }; S.focusId = "amt"; render();
  },
  "till-save": tillSave,
  "save-client": function (f, el) {
    var c = byId(el.dataset.id);
    if (Store.mode === "supabase")
      return remote(sbFetch("/rest/v1/clients?id=eq." + encodeURIComponent(c.id), {
        method: "PATCH", prefer: "return=minimal",
        body: { name: f.name.value.trim(), phone: normPhone(f.phone.value),
                email: f.email.value.trim() || null, bday: f.bday.value || null }
      }, true), "Fiche mise à jour.");
    c.name = f.name.value.trim(); c.phone = normPhone(f.phone.value);
    c.email = f.email.value.trim(); c.bday = f.bday.value;
    logIt("Fiche n° " + c.id + " modifiée");
    closeModal(); persist("Fiche mise à jour.");
  },
  "save-adjust": function (f, el) {
    var c = byId(el.dataset.id), p = Math.round(Number(f.p.value)), w = f.w.value.trim() || "Ajustement";
    if (!p) return toast("Indiquez un nombre de points.", "bad");
    if (Store.mode === "supabase")
      return remote(rpc("adjust_points", { p_id: c.id, p_points: p, p_label: w }, true), function () {
        return (p > 0 ? "+" : "") + p + " points pour " + c.name.split(" ")[0] + ".";
      });
    c.points += p; if (p > 0) c.lifetime += p;
    push(c, { t: today(), a: 0, p: p, w: w, k: "adj" });
    logIt((p > 0 ? "+" : "") + p + " points — n° " + c.id + " (" + w + ")");
    closeModal(); persist((p > 0 ? "+" : "") + p + " points pour " + c.name.split(" ")[0] + ".");
  },
  "admin-new": function (f) {
    var name = f.name.value.trim(), phone = normPhone(f.phone.value);
    var box = document.getElementById("an-err");
    if (name.length < 3) { box.innerHTML = '<p class="err">Nom trop court.</p>'; return; }
    if (phone.length < 9) { box.innerHTML = '<p class="err">Téléphone incomplet.</p>'; return; }
    if (DB.clients.some(function (c) { return normPhone(c.phone) === phone; })) {
      box.innerHTML = '<p class="err">Ce téléphone a déjà une carte.</p>'; return;
    }
    if (Store.mode === "supabase") {
      box.innerHTML = '<p class="small muted">Création…</p>';
      return remote(rpc("create_card", {
        p_name: name, p_phone: phone, p_bday: f.bday.value || null,
        p_email: f.email.value.trim() || null, p_ref: f.ref.value.trim() || null
      }, true).then(function (r) { S.till = { cid: r.id }; S.tab = "till"; return r; }),
        function (r) { return "Carte n° " + r.id + " créée pour " + name + "."; });
    }
    var parrain = f.ref.value.trim() ? DB.clients.filter(function (c) {
      return (c.code || "").toLowerCase() === f.ref.value.trim().toLowerCase() || c.id === f.ref.value.trim();
    })[0] : null;
    var sh = DB.shop;
    DB.seq = (DB.seq || 1000) + 1;
    var id = String(DB.seq);
    var c = { id: id, name: name, phone: phone, email: f.email.value.trim(), bday: f.bday.value,
      created: today(), points: sh.welcome, lifetime: sh.welcome, spent: 0, visits: 0,
      code: slug(name) + "-" + id, by: parrain ? parrain.id : "",
      hist: [{ t: today(), a: 0, p: sh.welcome, w: "Bienvenue — carte créée", k: "welcome" }] };
    if (parrain) {
      c.points += sh.godchild; c.lifetime += sh.godchild;
      push(c, { t: today(), a: 0, p: sh.godchild, w: "Parrainé par " + parrain.name, k: "ref" });
      parrain.points += sh.godfather; parrain.lifetime += sh.godfather;
      push(parrain, { t: today(), a: 0, p: sh.godfather, w: "Parrainage de " + name, k: "ref" });
    }
    DB.clients.unshift(c);
    logIt("Carte n° " + id + " créée — " + name);
    S.till = { cid: id }; S.tab = "till";
    closeModal(); persist("Carte n° " + id + " créée pour " + name + ".");
  },
  "save-sb": function (f) {
    var box = document.getElementById("sb-err");
    var url = f.url.value.trim().replace(/\/+$/, ""), key = f.key.value.trim();
    if (!/^https?:\/\//.test(url) || key.length < 20) {
      box.innerHTML = '<p class="err">Adresse ou clé incomplète.</p>'; return;
    }
    box.innerHTML = '<p class="small muted">Test de la connexion…</p>';
    SB.url = url; SB.key = key;
    rpc("public_shop", {}).then(function (d) {
      if (!d || !d.name) throw { message: "Le schéma n'est pas installé : exécutez supabase/schema.sql." };
      lsSet(LS_SB, JSON.stringify({ url: url, key: key }));
      toast("Base connectée.", "ok");
      setTimeout(function () { location.replace(location.pathname); }, 700);
    })["catch"](function (e) {
      box.innerHTML = '<p class="err">' + esc(errMsg(e)) + '</p>';
    });
  },
  "save-shop": function (f) {
    var sh = Store.mode === "supabase" ? JSON.parse(JSON.stringify(DB.shop)) : DB.shop;
    sh.name = f.name.value.trim() || sh.name;
    sh.city = f.city.value.trim(); sh.tagline = f.tagline.value.trim();
    sh.ppe = Math.max(0.5, Number(f.ppe.value) || 1);
    sh.welcome = Math.max(0, Math.round(Number(f.welcome.value) || 0));
    sh.birthday = Math.max(0, Math.round(Number(f.birthday.value) || 0));
    sh.godfather = Math.max(0, Math.round(Number(f.godfather.value) || 0));
    sh.godchild = Math.max(0, Math.round(Number(f.godchild.value) || 0));
    if (Store.mode === "supabase") return remote(saveShopRemote(sh), "Réglages enregistrés.");
    logIt("Réglages de la boutique modifiés");
    persist("Réglages enregistrés.");
  },
  "save-rewards": function (f) {
    var ps = f.querySelectorAll('input[name=p]'), ls = f.querySelectorAll('input[name=l]'), out = [];
    for (var i = 0; i < ps.length; i++) {
      var p = Math.round(Number(ps[i].value)), l = ls[i].value.trim();
      if (p > 0 && l) out.push({ p: p, label: l });
    }
    if (!out.length) return toast("Gardez au moins une récompense.", "bad");
    out.sort(function (a, b) { return a.p - b.p; });
    if (Store.mode === "supabase") {
      var sh2 = JSON.parse(JSON.stringify(DB.shop)); sh2.rewards = out;
      return remote(saveShopRemote(sh2), "Barème enregistré.");
    }
    DB.shop.rewards = out;
    logIt("Barème de récompenses modifié");
    persist("Barème enregistré.");
  },
  "save-pin": function (f) {
    var box = document.getElementById("pin-err");
    if (String(f.old.value) !== String(DB.admin.pin)) { box.innerHTML = '<p class="err">Code actuel incorrect.</p>'; return; }
    var n = String(f.neo.value).trim();
    if (n.length < 4) { box.innerHTML = '<p class="err">4 caractères minimum.</p>'; return; }
    DB.admin.pin = n; logIt("Code d'accès modifié");
    persist("Code d'accès changé.");
  },
  "do-restore": function (f) {
    var box = document.getElementById("r-err");
    try {
      var d = migrate(JSON.parse(f.json.value));
      if (!d || !d.clients) throw 0;
      if (Store.mode === "supabase")
        return remote(rpc("import_clients", { p_data: d }, true),
          "Import terminé : " + d.clients.length + " fiches.");
      DB = d; logIt("Sauvegarde restaurée");
      closeModal(); persist("Sauvegarde restaurée : " + d.clients.length + " fiches.");
    } catch (e) { box.innerHTML = '<p class="err">Fichier illisible. Collez le contenu complet du fichier JSON.</p>'; }
  }
};

/* ── écouteurs ── */
document.addEventListener("click", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var a = el.dataset.act;
  if (el.tagName === "FORM" || el.tagName === "INPUT" || el.tagName === "SELECT") return;
  if (ACTS[a]) { ev.preventDefault(); S.scroll = window.scrollY; ACTS[a](el, ev); }
});
document.addEventListener("submit", function (ev) {
  var f = ev.target.closest("form[data-act]");
  if (!f) return;
  ev.preventDefault();
  var h = FORMS[f.dataset.act];
  if (h) { S.scroll = window.scrollY; h(f, f); }
});
document.addEventListener("change", function (ev) {
  var el = ev.target.closest("[data-act]");
  if (!el) return;
  if (el.dataset.act === "sort") { S.scroll = window.scrollY; ACTS.sort(el); }
  if (el.dataset.act === "pick-file") ACTS["pick-file"](el);
});
var qt = null;
document.addEventListener("input", function (ev) {
  var el = ev.target;
  if (el.dataset && el.dataset.act === "search-live") {
    clearTimeout(qt);
    qt = setTimeout(function () { S.q = el.value; S.focusId = "cq"; S.scroll = window.scrollY; render(); }, 220);
  }
});
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter" && ev.target.tagName === "TR" && ev.target.dataset.act) {
    ACTS[ev.target.dataset.act](ev.target, ev);
  }
});

/* ── démarrage ── */
function bootFail(e) {
  S.view = "error"; S.errMsg = errMsg(e); render();
}

/* Démarrage quand une base en ligne est configurée. */
function bootRemote() {
  var tok = urlToken();
  if (tok) {
    return rpc("get_card", { p_token: tok }).then(function (card) {
      if (!card) {
        S.view = "find";
        return sbShop().then(function () {
          render();
          toast("Ce lien de carte n'existe plus.", "bad");
        });
      }
      DB = { v: 1, shop: card.shop, admin: { pin: "" }, seq: 0,
             clients: [cardToClient(card, tok)], recent: [], log: [] };
      S.cid = card.id; S.view = "card"; S.admin = false;
      render();
    })["catch"](bootFail);
  }
  return sbShop().then(function () {
    return sbRestore();
  }).then(function (ok) {
    if (!ok) { S.admin = false; render(); return; }
    if (!S.admin) { render(); return; }
    return sbLoadAll().then(function () { S.tab = S.tab || "dash"; render(); });
  })["catch"](bootFail);
}

function boot() {
  DB = migrate(embedded()) || { v: 1, shop: {}, admin: { pin: "4726" }, seq: 1000, clients: [], log: [] };
  S = loadSession();

  var cfg = sbConfig();
  if (cfg) {
    SB.url = cfg.url.replace(/\/+$/, ""); SB.key = cfg.key;
    Store.mode = "supabase";
    if (S.view === "card" && !urlToken()) S.view = "home";
    return bootRemote();
  }

  var api = window.claude && window.claude.use ? window.claude.use("artifact") : null;
  var done = function () {
    if (Store.mode !== "cloud") {
      var l = lsGet(LS_DB);
      if (l) { try { var d = migrate(JSON.parse(l)); if (d) DB = d; } catch (e) {} }
    }
    if (!S.cid) { var me = lsGet(LS_ME); if (me && byId(me)) S.cid = me; }
    if (S.view === "card" && !byId(S.cid)) S.view = "home";
    render();
    if (S.flash) { toast(S.flash, "ok"); S.flash = ""; saveSession(); }
  };
  if (api && api.then) {
    api.then(function (a) { if (a) { Store.api = a; Store.mode = "cloud"; } done(); })["catch"](done);
  } else { done(); }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
